// Janela de pré-visualização: toca o canal sem som enquanto a pessoa percorre a lista.
function LivePreview({ item, session, url, suspended, onFull, onClose }) {
  const videoRef = useRef(null);
  const mutedRef = useRef(true);
  const [state, setState] = useState('load');
  const [muted, setMuted] = useState(true);
  const now = useEpg(session, item, !!item.epg_channel_id);
  const c = useMemo(() => parseChannel(item.name), [item.name]);

  useEffect(() => {
    if (suspended) return;
    const video = videoRef.current;
    let hls = null;
    setState('load');
    video.muted = mutedRef.current;
    const onPlaying = () => setState('play');
    const onWaiting = () => setState((s) => (s === 'err' ? s : 'load'));
    const fail = () => setState('err');
    const start = () => {
      const p = video.play();
      if (p && p.catch) p.catch(() => {
        // O navegador barrou o som automático: volta a tocar mudo.
        mutedRef.current = true; video.muted = true; setMuted(true);
        const p2 = video.play(); if (p2 && p2.catch) p2.catch(() => {});
      });
    };
    video.addEventListener('playing', onPlaying);
    video.addEventListener('waiting', onWaiting);
    if (video.canPlayType('application/vnd.apple.mpegurl') !== '') { video.onerror = fail; video.src = url; start(); }
    else if (window.Hls && window.Hls.isSupported()) {
      hls = new window.Hls({ maxBufferLength: 10 });
      hls.loadSource(url);
      hls.attachMedia(video);
      hls.on(window.Hls.Events.MANIFEST_PARSED, start);
      hls.on(window.Hls.Events.ERROR, (_, d) => { if (d.fatal) fail(); });
    } else fail();
    return () => {
      video.removeEventListener('playing', onPlaying);
      video.removeEventListener('waiting', onWaiting);
      video.onerror = null;
      if (hls) hls.destroy();
      video.pause();
      video.removeAttribute('src');
      video.load();
    };
  }, [url, suspended]);

  const toggleMute = () => {
    const next = !mutedRef.current;
    mutedRef.current = next; setMuted(next);
    if (videoRef.current) videoRef.current.muted = next;
  };

  return (
    <div className="pv">
      <div className="pv__frame">
        <video ref={videoRef} playsInline webkit-playsinline="true" muted />
        <div className="pv__shade" />
        {state === 'load' && !suspended && <div className="player__wait"><div className="spinner" /></div>}
        {state === 'err' && <div className="pv__err"><i className="ri-signal-wifi-off-line" /><span>Sem sinal neste canal agora</span></div>}
        <button className="pv__hit" onClick={onFull} aria-label={`Assistir ${c.title} em tela cheia`} />
        <div className="pv__top">
          <span className="pv__live"><i />AO VIVO</span>
          <div style={{ display: 'flex', gap: 8 }}>
            <button className="iconbtn iconbtn--glass" onClick={toggleMute} aria-label={muted ? 'Ligar o som' : 'Desligar o som'}><i className={muted ? 'ri-volume-mute-line' : 'ri-volume-up-line'} /></button>
            <button className="iconbtn iconbtn--glass" onClick={onClose} aria-label="Fechar pré-visualização"><i className="ri-close-line" /></button>
          </div>
        </div>
        <div className="pv__info">
          <div className="pv__txt">
            <p className="pv__name clamp-2">{c.title}</p>
            {now && <p className="pv__now clamp-1">{now.title}, até {hhmm(now.stop)}</p>}
          </div>
          <button className="btn btn--primary btn--sm" onClick={onFull}><i className="ri-fullscreen-line" />Assistir</button>
        </div>
      </div>
    </div>
  );
}

const LIVE_PEEK = 5;
function Live({ data, session, liveUrl, selected, onSelect, onPlay, previewOn, suspended }) {
  const [rows, setRows] = useState(ROWS_PAGE);
  const [shown, setShown] = useState(GRID_PAGE);
  const [pv, setPv] = useState(null);
  useEffect(() => { setShown(GRID_PAGE); window.scrollTo(0, 0); }, [selected]);

  // Ao entrar, volta a mostrar o último canal visto.
  useEffect(() => {
    if (!previewOn) { setPv(null); return; }
    let alive = true;
    idbGet('lastLive').then((id) => {
      if (!alive || id == null) return;
      const it = data.live.find((x) => String(x.stream_id) === String(id));
      if (it) setPv((cur) => cur || it);
    }).catch(() => {});
    return () => { alive = false; };
  }, [previewOn, data]);

  const cats = data.liveCats, byCat = data.liveByCat;
  const usable = useMemo(() => cats.filter((c) => (byCat.get(String(c.category_id)) || []).length > 0), [cats, byCat]);
  const list = selected != null ? (byCat.get(String(selected)) || []) : (usable.length === 0 ? data.live : null);

  const remember = (it) => { idbSet('lastLive', it.stream_id).catch(() => {}); };
  const play = (it) => { remember(it); if (previewOn) setPv(it); onPlay(it); };
  const pick = (it) => {
    if (!previewOn || (pv && pv.stream_id === it.stream_id)) { play(it); return; }
    remember(it); setPv(it);
  };
  const row = (it) => <ChannelRow key={it.stream_id} item={it} session={session} active={!!pv && pv.stream_id === it.stream_id} onSelect={() => pick(it)} onPlay={() => play(it)} />;

  if (data.live.length === 0) {
    return (
      <div className="page">
        <h1 className="page__title">Ao vivo</h1>
        <div className="empty">
          <div className="empty__ico"><i className="ri-moon-clear-line" /></div>
          <h3>Nada por aqui</h3>
          <p>Sua playlist não trouxe canais ao vivo.</p>
        </div>
      </div>
    );
  }

  return (
    <div className="page">
      <h1 className="page__title">Ao vivo</h1>
      <div className={'chips noscroll' + (pv ? ' chips--flow' : '')}>
        <button className={'chip' + (selected == null ? ' is-on' : '')} onClick={() => onSelect(null)}>Tudo</button>
        {usable.map((c) => (
          <button key={c.category_id} className={'chip' + (String(selected) === String(c.category_id) ? ' is-on' : '')} onClick={() => onSelect(c.category_id)}>
            {c.category_name}<small>{byCat.get(String(c.category_id)).length}</small>
          </button>
        ))}
      </div>

      <div className={'live' + (pv ? ' has-pv' : '')}>
        {pv && <LivePreview item={pv} session={session} url={liveUrl(pv)} suspended={suspended} onFull={() => play(pv)} onClose={() => setPv(null)} />}
        <div>
          {previewOn && !pv && <p className="live__hint"><i className="ri-picture-in-picture-2-line" />Toque em um canal para espiar o que está passando. Toque de novo para abrir em tela cheia.</p>}
          {list ? (
            <>
              <div className="chlist">{list.slice(0, shown).map(row)}</div>
              {shown < list.length && <Sentinel key={shown} onVisible={() => setShown((n) => n + GRID_PAGE)} />}
            </>
          ) : (
            <>
              {usable.slice(0, rows).map((c) => {
                const all = byCat.get(String(c.category_id));
                return (
                  <section key={c.category_id} className="live__sec">
                    <div className="live__head">
                      <h2 className="row__title clamp-1">{c.category_name}</h2>
                      {all.length > LIVE_PEEK && <button className="row__more" onClick={() => onSelect(c.category_id)}>Ver todos os {all.length}</button>}
                    </div>
                    <div className="chlist">{all.slice(0, LIVE_PEEK).map(row)}</div>
                  </section>
                );
              })}
              {rows < usable.length && <Sentinel key={rows} onVisible={() => setRows((n) => n + ROWS_PAGE)} />}
            </>
          )}
        </div>
      </div>
    </div>
  );
}

      {entry.season && <span>{entry.season.replace(((entry.alt && entry.alt[0]) || entry.title) + ': ', '').replace(/^Season (\d+)$/i, 'Temporada $1').replace(/^Part (\d+)$/i, 'Parte $1').replace(/^Limited Series$/i, 'Minissérie')}</span>}
      {entry.parts > 1 && <span>{entry.parts} temporadas no ranking</span>}
      {entry.year && <span>{entry.year}</span>}
      {entry.rating && <span><i className="ri-star-fill" />{entry.rating}</span>}
      {entry.weeks > 1 && <span>{entry.weeks} semanas no Top 10</span>}
    </span>
  );
  const body = (
    <>
      <span className="rank__n">{entry.rank}</span>
      <div className="rank__art"><div className="ph"><i className="ri-film-line" /></div><Art src={entry.poster || (found && (found.stream_icon || found.cover)) || ''} /></div>
      <div className="rank__txt"><p className="rank__t clamp-2">{entry.title}</p>{sub}</div>
      {found && <span className="rank__go"><i className="ri-play-fill" /></span>}
    </>
  );
  return found
    ? <button className="rank" onClick={() => onOpen(found, entry.kind)}>{body}</button>
    : <button className="rank is-off" onClick={() => onSearch(entry.title)} aria-label={`Procurar ${entry.title} na playlist`}>{body}</button>;
}

const dayMonth = (iso) => (iso ? new Date(iso + 'T12:00:00').toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' }) : '');

function Trending({ charts, onOpen, onSearch }) {
  const [platId, setPlatId] = useState('netflix');
  const [mode, setMode] = useState('official'); // só vale para quem tem ranking oficial
  const all = charts.charts;
  const plats = PLATFORMS.filter((p) => (all.daily && all.daily[p.id]) || (all.official && all.official[p.id]));
  const plat = plats.find((p) => p.id === platId) || plats[0];
  const official = plat && all.official ? all.official[plat.id] : null;
  const daily = plat && all.daily ? all.daily[plat.id] : null;
  const isOfficial = !!official && (mode === 'official' || !daily);
  const d = isOfficial ? official : daily;

  const rows = useMemo(() => {
    if (!d) return null;
    const map = (arr) => uniqEntries(arr).map((entry) => ({ entry, found: charts.match(entry) }));
    return { series: map(d.series), movies: map(d.movies) };
  }, [d, charts.match]);
  const total = rows ? rows.series.length + rows.movies.length : 0;
  const mine = rows ? [...rows.series, ...rows.movies].filter((r) => r.found).length : 0;

  const section = (title, list) => {
    return (
      <section>
        <h2 className="trend__h">{title}</h2>
        {list.length === 0
          ? <p className="hint">Sem títulos nesta lista agora.</p>
          : <div className="ranks">{list.map((r) => <RankRow key={r.entry.kind + r.entry.rank} entry={r.entry} found={r.found} onOpen={onOpen} onSearch={onSearch} />)}</div>}
      </section>
    );
  };

  return (
    <div className="page">
      <h1 className="page__title">Em alta</h1>
      <div className="chips noscroll">
        {plats.map((p) => (
          <button key={p.id} className={'chip' + (plat && p.id === plat.id ? ' is-on' : '')} onClick={() => { setPlatId(p.id); window.scrollTo(0, 0); }}>
            <i className="dot" style={{ background: p.color }} />{p.name}
          </button>
        ))}
      </div>

      <div className="trend">
        {official && daily && (
          <div className="seg" role="tablist">
            <button role="tab" aria-selected={isOfficial} className={isOfficial ? 'is-on' : ''} onClick={() => setMode('official')}>Top 10 oficial</button>
            <button role="tab" aria-selected={!isOfficial} className={!isOfficial ? 'is-on' : ''} onClick={() => setMode('daily')}>Em alta hoje</button>
          </div>
        )}

        {rows && (
          <>
            <div className="trend__sum">
              <span className="trend__big gradtext">{mine}<small style={{ WebkitTextFillColor: 'var(--mute)' }}>/{total}</small></span>
              <p>
                <b>{mine === 0 ? 'Nenhum título na sua playlist' : mine === 1 ? '1 título está na sua playlist' : `${mine} títulos estão na sua playlist`}</b>
                {isOfficial
                  ? `Top 10 oficial da ${plat.name} no Brasil, semana até ${dayMonth(d.week)}`
                  : `Em alta no catálogo ${plat.name} Brasil, atualizado em ${dayMonth(d.updated)}`}
              </p>
            </div>
            <div className="trend__cols">
              {section(isOfficial ? 'Séries no Top 10' : 'Séries em alta', rows.series)}
              {section(isOfficial ? 'Filmes no Top 10' : 'Filmes em alta', rows.movies)}
            </div>
            <p className="trend__note">
              {isOfficial
                ? 'Fonte: Netflix Top 10 (netflix.com/tudum/top10). A Netflix divulga este ranking uma vez por semana, às terças.'
                : `Fonte: tendências diárias do JustWatch para o catálogo ${plat.name}. A plataforma não divulga ranking próprio.`}
              {charts.status === 'stale' && ' Não deu para baixar a versão mais nova agora; esta é a última salva. '}
              {charts.status === 'stale' && <button style={{ color: '#cdbcff', fontWeight: 600 }} onClick={charts.refresh}>Tentar de novo</button>}
            </p>
          </>
        )}
        {!rows && (
          <div className="empty">
            <div className="empty__ico"><i className="ri-fire-line" /></div>
            <h3>Ranking indisponível</h3>
            <p>Não há dados desta plataforma agora.</p>
            <button className="btn btn--ghost btn--sm" style={{ marginTop: 8 }} onClick={charts.refresh}>Tentar de novo</button>
          </div>
        )}
      </div>
    </div>
  );
}

/* ============================== Busca ============================== */
const RESULTS_LIMIT = 90;
const KIND_LABEL = { movie: 'Filme', series: 'Série', live: 'Canal' };

function SearchScreen({ data, onOpen, history, addHistory, clearHistory, seed }) {
  const [raw, setRaw] = useState(seed || '');
  const [q, setQ] = useState(seed || '');
  const [seg, setSeg] = useState('all');

  useEffect(() => { const t = setTimeout(() => setQ(raw.trim()), 220); return () => clearTimeout(t); }, [raw]);

  const found = useMemo(() => {
    if (!q) return null;
    const term = q.toLowerCase();
    const pick = (arr, kind) => { const out = []; for (const x of arr) if (x.name_lc.includes(term)) out.push({ item: x, kind }); return out; };
    return { movie: pick(data.movies, 'movie'), series: pick(data.series, 'series'), live: pick(data.live, 'live') };
  }, [q, data]);

  const results = useMemo(() => {
    if (!found) return [];
    return seg === 'all' ? [...found.series, ...found.movie, ...found.live] : found[seg];
  }, [found, seg]);

  const suggestions = useMemo(() => [
    ...data.seriesTop.slice(0, 6).map((item) => ({ item, kind: 'series' })),
    ...data.movieTop.slice(0, 6).map((item) => ({ item, kind: 'movie' })),
  ], [data]);

  const total = found ? found.movie.length + found.series.length + found.live.length : 0;
  const open = (r) => { addHistory(q); onOpen(r.item, r.kind); };

  return (
    <div className="page">
      <div className="search">
        <div className="search__box">
          <i className="ri-search-2-line" />
          <input className="search__input" value={raw} autoFocus enterKeyHint="search" autoComplete="off" autoCorrect="off" spellCheck="false"
            placeholder="Buscar filmes, séries e canais"
            onChange={(e) => setRaw(e.target.value)}
            onKeyDown={(e) => { if (e.key === 'Enter') { addHistory(raw); e.currentTarget.blur(); } }} />
          {raw && <button className="search__clear" onClick={() => setRaw('')} aria-label="Limpar busca"><i className="ri-close-line" /></button>}
        </div>

        {!q && history.length > 0 && (
          <>
            <div className="search__h"><h2>Buscas recentes</h2><button onClick={clearHistory}>Limpar</button></div>
            <div className="recent">
              {history.map((h) => <button key={h} onClick={() => setRaw(h)}><i className="ri-history-line" />{h}</button>)}
            </div>
          </>
        )}

        {!q && suggestions.length > 0 && <div className="search__h"><h2>Mais bem avaliados</h2></div>}

        {q && (
          <div className="search__seg noscroll">
            {[['all', 'Tudo', total], ['series', 'Séries', found.series.length], ['movie', 'Filmes', found.movie.length], ['live', 'Canais', found.live.length]].map(([id, label, n]) => (
              <button key={id} className={'chip' + (seg === id ? ' is-on' : '')} onClick={() => setSeg(id)}>{label}<small>{n}</small></button>
            ))}
          </div>
        )}
        {q && results.length > RESULTS_LIMIT && <p className="hint">Mostrando {RESULTS_LIMIT} de {results.length}. Digite mais para refinar.</p>}
      </div>

      {!q && (
        <div className="grid">
          {suggestions.map((r) => <Poster key={r.kind + (r.item.stream_id || r.item.series_id)} item={r.item} kind={r.kind} grid onClick={() => onOpen(r.item, r.kind)} />)}
        </div>
      )}

      {q && results.length > 0 && (
        <div className="grid">
          {results.slice(0, RESULTS_LIMIT).map((r) => (
            <Poster key={r.kind + (r.item.stream_id || r.item.series_id)} item={r.item} kind={r.kind} grid tag={seg === 'all' ? KIND_LABEL[r.kind] : null} onClick={() => open(r)} />
          ))}
        </div>
      )}

      {q && results.length === 0 && (
        <div className="empty">
          <div className="empty__ico"><i className="ri-search-eye-line" /></div>
          <h3>Nada encontrado</h3>
          <p>Nenhum título com “{q}”. Tente outra grafia ou menos palavras.</p>
        </div>
      )}
    </div>
  );
}

/* ============================== Player ============================== */
function Player({ playable, onProgress, onClose }) {
  const videoRef = useRef(null);
  const hlsRef = useRef(null);
  const [err, setErr] = useState(null);
  const [waiting, setWaiting] = useState(true);
  const [toast, setToast] = useState(null);
  const cbRef = useRef(onProgress);
  cbRef.current = onProgress;
  const closeRef = useRef(onClose);
  closeRef.current = onClose;

  useEffect(() => {
    const video = videoRef.current;
    const isLive = !!playable.isLive;
    const isHls = playable.url.includes('.m3u8');
    const nativeHls = video.canPlayType('application/vnd.apple.mpegurl') !== '';
    setErr(null); setWaiting(true);

    /* ----- retomada: só começa a gravar progresso depois que o salto deu certo -----
       Antes, se o salto falhava, o vídeo começava do zero e sobrescrevia o ponto salvo. */
    const target = !isLive && playable.resumeAt > 3 ? playable.resumeAt : 0;
    let seekDone = target === 0;
    let attempts = 0;
    let lastSave = 0;
    let toastTimer = null;

    function markSeekDone(ok) {
      if (seekDone) return;
      seekDone = true;
      if (ok) { setToast(`Retomando de ${fmtClock(target)}`); toastTimer = setTimeout(() => setToast(null), 2600); }
    }
    function trySeek() {
      if (seekDone) return;
      if (video.readyState < 1 || video.seeking) return;
      if (Math.abs(video.currentTime - target) < 2.5) { markSeekDone(true); return; }
      if (attempts >= 8) { markSeekDone(false); return; }
      attempts++;
      try { video.currentTime = target; } catch (e) {}
    }
    function flush() {
      if (isLive || !seekDone) return;
      const d = video.duration;
      if (!isFinite(d) || d <= 0) return;
      lastSave = Date.now();
      cbRef.current(video.currentTime, d);
    }

    const onTime = () => {
      if (!seekDone) { trySeek(); return; }
      if (Date.now() - lastSave > 3000) flush();
    };
    const onSeeked = () => { if (!seekDone) trySeek(); else flush(); };
    const onWaiting = () => setWaiting(true);
    const onPlaying = () => { setWaiting(false); trySeek(); };
    const onCanPlay = () => { setWaiting(false); trySeek(); };
    const onHidden = () => { if (document.hidden) flush(); };
    const onEndFullscreen = () => {
      // Entrar em Picture-in-Picture também dispara este evento no iOS.
      if (video.webkitPresentationMode === 'picture-in-picture') return;
      flush();
      closeRef.current();
    };

    video.addEventListener('loadedmetadata', trySeek);
    video.addEventListener('loadeddata', trySeek);
    video.addEventListener('canplay', onCanPlay);
    video.addEventListener('playing', onPlaying);
    video.addEventListener('waiting', onWaiting);
    video.addEventListener('timeupdate', onTime);
    video.addEventListener('seeked', onSeeked);
    video.addEventListener('pause', flush);
    video.addEventListener('ended', flush);
    video.addEventListener('webkitendfullscreen', onEndFullscreen);
    document.addEventListener('visibilitychange', onHidden);
    window.addEventListener('pagehide', flush);

    if (isHls && nativeHls) {
      video.onerror = () => setErr('Este canal não respondeu. Tente de novo em instantes.');
      video.src = playable.url;
    } else if (isHls && window.Hls && window.Hls.isSupported()) {
      const hls = new window.Hls();
      hlsRef.current = hls;
      hls.loadSource(playable.url);
      hls.attachMedia(video);
      hls.on(window.Hls.Events.ERROR, (_, d) => {
        if (d.fatal) setErr('Este canal não tocou neste navegador. Fora do Safari, a TV ao vivo é limitada.');
      });
    } else if (isHls) {
      setErr('Este navegador não reproduz TV ao vivo.');
    } else {
      video.onerror = () => setErr('Não foi possível reproduzir este vídeo. O arquivo pode estar fora do ar.');
      video.src = playable.url;
    }

    return () => {
      // Grava a posição exata ANTES de desmontar o vídeo.
      flush();
      clearTimeout(toastTimer);
      video.removeEventListener('loadedmetadata', trySeek);
      video.removeEventListener('loadeddata', trySeek);
      video.removeEventListener('canplay', onCanPlay);
      video.removeEventListener('playing', onPlaying);
      video.removeEventListener('waiting', onWaiting);
      video.removeEventListener('timeupdate', onTime);
      video.removeEventListener('seeked', onSeeked);
      video.removeEventListener('pause', flush);
      video.removeEventListener('ended', flush);
      video.removeEventListener('webkitendfullscreen', onEndFullscreen);
      document.removeEventListener('visibilitychange', onHidden);
      window.removeEventListener('pagehide', flush);
      video.onerror = null;
      if (hlsRef.current) { hlsRef.current.destroy(); hlsRef.current = null; }
      video.pause();
      video.removeAttribute('src');
      video.load();
    };
  }, [playable.url]);

  return (
    <div className="player">
      <div className="player__bar">
        <button className="iconbtn" onClick={onClose} aria-label="Fechar player"><i className="ri-arrow-down-s-line" /></button>
        <div className="player__t">
          <b className="clamp-1">{playable.title}</b>
          {playable.subtitle && <span className="clamp-1">{playable.subtitle}</span>}
        </div>
        {playable.isLive && <span className="pill pill--grad">Ao vivo</span>}
      </div>
      <div className="player__stage">
        <video ref={videoRef} controls autoPlay playsInline webkit-playsinline="true" />
        {waiting && !err && <div className="player__wait"><div className="spinner" /></div>}
        {toast && <div className="player__toast"><i className="ri-history-line" />{toast}</div>}
        {err && (
          <div className="player__err">
            <i className="ri-error-warning-line" />
            <p style={{ maxWidth: '32ch' }}>{err}</p>
            <button className="btn btn--ghost btn--sm" onClick={onClose}>Fechar player</button>
          </div>
        )}
      </div>
    </div>
  );
}

function SeriesDetail({ series, focusEpisodeId, fetchSeriesInfo, onClose, onPlayEpisode, onToggleWatched, progressMap, isFavorite, onToggleFavorite, onPickVersion }) {
  const [info, setInfo] = useState(null);
  const [loading, setLoading] = useState(true);
  const [failed, setFailed] = useState(false);
  const [seasonNum, setSeasonNum] = useState(null);
  const [hereId, setHereId] = useState(null);
  const placed = useRef(false);

  useEffect(() => {
    let alive = true;
    placed.current = false;
    setLoading(true); setFailed(false); setInfo(null); setSeasonNum(null);
    fetchSeriesInfo(series.series_id)
      .then((d) => { if (alive) { setInfo(d); setLoading(false); } })
      .catch(() => { if (alive) { setFailed(true); setLoading(false); } });
    return () => { alive = false; };
  }, [series.series_id]);

  const flat = useMemo(() => flattenEpisodes(info), [info]);
  const seasons = useMemo(() => { const seen = []; for (const f of flat) if (!seen.includes(f.season)) seen.push(f.season); return seen; }, [flat]);
  const indexById = useMemo(() => { const m = new Map(); flat.forEach((f, i) => m.set(String(f.ep.id), i)); return m; }, [flat]);

  // Onde a pessoa parou: o último episódio que realmente tocou; se ele já acabou, o seguinte.
  const resume = useMemo(() => {
    let lastIdx = -1, lastP = null;
    flat.forEach((f, i) => {
      const p = progressMap[`episode-${f.ep.id}`];
      if (p && p.playedAt && (!lastP || p.playedAt > lastP.playedAt)) { lastP = p; lastIdx = i; }
    });
    if (lastIdx < 0) return null;
    if (!lastP.watched) return { ...flat[lastIdx], p: lastP, kind: 'resume' };
    const nx = flat[lastIdx + 1];
    if (!nx) return null;
    const np = progressMap[`episode-${nx.ep.id}`];
    return { ...nx, p: np && !np.watched ? np : null, kind: 'next' };
  }, [flat, progressMap]);

  // Ao abrir: vai direto para a temporada certa e rola até o episódio.
  useEffect(() => {
    if (placed.current || flat.length === 0) return;
    placed.current = true;
    let target = null;
    if (focusEpisodeId != null && indexById.has(String(focusEpisodeId))) target = flat[indexById.get(String(focusEpisodeId))];
    else if (resume) target = resume;
    setSeasonNum(target ? target.season : seasons[0]);
    if (target) {
      const id = String(target.ep.id);
      setHereId(id);
      setTimeout(() => {
        const el = document.getElementById('ep-' + id);
        if (el) el.scrollIntoView({ block: 'center', behavior: 'smooth' });
      }, 420);
    }
  }, [flat, indexById, resume, focusEpisodeId, seasons]);

  function play(f) {
    const nx = flat[indexById.get(String(f.ep.id)) + 1];
    setHereId(String(f.ep.id));
    onPlayEpisode({
      id: f.ep.id, seriesId: series.series_id, seriesName: series.name, cover: series.cover || (info && info.info && info.info.cover) || '',
      season: f.season, episodeNum: f.ep.episode_num, epTitle: f.ep.title || '', ext: f.ep.container_extension || 'mp4',
      nextEp: nx ? nextRef(nx.ep, nx.season) : null,
    });
  }

  const meta = info && info.info ? info.info : {};
  const cover = series.cover || meta.cover || '';
  const backdrop = Array.isArray(meta.backdrop_path) && meta.backdrop_path[0] ? meta.backdrop_path[0] : '';
  const plot = meta.plot || series.plot || '';
  const rating = ratingOf({ ...series, ...meta });
  const year = String(meta.releaseDate || meta.release_date || series.releaseDate || '').slice(0, 4);
  const fav = isFavorite('series', series.series_id);
  const episodes = flat.filter((f) => f.season === seasonNum);
  const here = hereId || (resume && String(resume.ep.id));

  return (
    <DetailShell
      title={series.name} poster={cover} backdrop={backdrop} fav={fav} onClose={onClose}
      onFav={() => onToggleFavorite({ type: 'series', id: series.series_id, name: series.name, poster: cover })}
      meta={<>
        {rating && <span className="pill pill--star"><i className="ri-star-fill" />{rating}</span>}
        {year && /^\d{4}$/.test(year) && <span className="pill">{year}</span>}
        {seasons.length > 0 && <span className="pill">{seasons.length} {seasons.length === 1 ? 'temporada' : 'temporadas'}</span>}
      </>}
    >
      <Versions item={series} idField="series_id" onPick={onPickVersion} />
      <Plot text={plot} />
      {meta.genre && <p className="detail__facts"><b>Gênero</b> {meta.genre}</p>}
      {meta.cast && <p className="detail__facts clamp-2"><b>Elenco</b> {meta.cast}</p>}

      {loading && <Spinner />}
      {failed && (
        <div className="empty">
          <div className="empty__ico"><i className="ri-wifi-off-line" /></div>
          <h3>Episódios indisponíveis</h3>
          <p>O servidor não respondeu. Feche e abra a série para tentar de novo.</p>
        </div>
      )}

      {!loading && resume && (
        <button className="resume" onClick={() => play(resume)}>
          <span className="resume__play"><i className="ri-play-fill" /></span>
          <span className="resume__txt">
            <span className="resume__k">{resume.kind === 'next' ? 'Próximo episódio' : 'Continuar de onde parou'}</span>
            <p className="resume__t clamp-1">T{resume.season} E{resume.ep.episode_num} {cleanEpTitle(resume.ep.title, series.name, resume.ep.episode_num)}</p>
            <span className="track" style={{ display: 'block' }}><span style={{ width: pctOf(resume.p) + '%' }} /></span>
            {resume.p && resume.p.duration > 0 && (
              <span className="resume__foot"><span>{fmtClock(resume.p.time)}</span><span>{fmtLeft(resume.p.duration - resume.p.time)}</span></span>
            )}
          </span>
        </button>
      )}

      {!loading && seasons.length > 0 && (
        <>
          <div className="seasons noscroll">
            {seasons.map((s) => (
              <button key={s} className={'chip' + (s === seasonNum ? ' is-on' : '')} onClick={() => setSeasonNum(s)}>Temporada {s}</button>
            ))}
          </div>
          <div className="eps">
            {episodes.map((f) => {
              const ep = f.ep;
              const p = progressMap[`episode-${ep.id}`];
              const watched = !!(p && p.watched);
              const pct = pctOf(p);
              const isHere = String(ep.id) === here;
              const mins = epMinutes(ep);
              return (
                <div key={ep.id} id={'ep-' + ep.id} className={'ep' + (isHere ? ' is-here' : '') + (watched ? ' is-watched' : '')}>
                  <button className="ep__main" onClick={() => play(f)}>
                    <div className="ep__thumb">
                      <div className="ph"><i className="ri-play-circle-line" /></div>
                      <Art src={(ep.info && ep.info.movie_image) || cover} />
                      {isHere && <div className="ep__playing"><i className="ri-play-fill" /></div>}
                      {pct > 0 && <div className="track"><span style={{ width: pct + '%' }} /></div>}
                    </div>
                    <div style={{ minWidth: 0, flex: 1 }}>
                      <p className="ep__n">
                        E{ep.episode_num}
                        {isHere && !watched ? <span className="ep__here">Você parou aqui</span> : (mins && <span>{mins} min</span>)}
                      </p>
                      <p className="ep__t clamp-2">{cleanEpTitle(ep.title, series.name, ep.episode_num)}</p>
                    </div>
                  </button>
                  <button className={'ep__check' + (watched ? ' is-on' : '')} onClick={() => onToggleWatched(f, series, cover)}
                    aria-label={watched ? 'Marcar como não assistido' : 'Marcar como assistido'}>
                    <i className={watched ? 'ri-checkbox-circle-fill' : 'ri-checkbox-blank-circle-line'} />
                  </button>
                </div>
              );
            })}
          </div>
        </>
      )}

      {!loading && !failed && seasons.length === 0 && (
        <div className="empty">
          <div className="empty__ico"><i className="ri-moon-clear-line" /></div>
          <h3>Sem episódios</h3>
          <p>Esta série ainda não tem episódios na sua playlist.</p>
        </div>
      )}
    </DetailShell>
  );
}

function MovieDetail({ movie, fetchMovieInfo, onClose, onPlay, progressMap, isFavorite, onToggleFavorite, onPickVersion }) {
  const [info, setInfo] = useState(null);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    let alive = true;
    setLoading(true); setInfo(null);
    fetchMovieInfo(movie.stream_id).then((d) => { if (alive) { setInfo(d); setLoading(false); } }).catch(() => { if (alive) setLoading(false); });
    return () => { alive = false; };
  }, [movie.stream_id]);

  const p = progressMap[`movie-${movie.stream_id}`];
  const inProgress = !!(p && !p.watched && p.duration > 0 && p.time > 3);
  const pct = pctOf(p);
  const fav = isFavorite('movie', movie.stream_id);
  const meta = info && info.info && !Array.isArray(info.info) ? info.info : {};
  const backdrop = Array.isArray(meta.backdrop_path) && meta.backdrop_path[0] ? meta.backdrop_path[0] : '';
  const rating = ratingOf({ ...movie, ...meta });
  const year = String(meta.releasedate || meta.releaseDate || meta.year || '').slice(0, 4);

  return (
    <DetailShell
      title={movie.name} poster={movie.stream_icon || meta.movie_image} backdrop={backdrop} fav={fav} onClose={onClose}
      onFav={() => onToggleFavorite({ type: 'movie', id: movie.stream_id, name: movie.name, poster: movie.stream_icon, container_extension: movie.container_extension })}
      meta={<>
        {rating && <span className="pill pill--star"><i className="ri-star-fill" />{rating}</span>}
        {/^\d{4}$/.test(year) && <span className="pill">{year}</span>}
        {meta.duration && <span className="pill">{meta.duration}</span>}
        {p && p.watched && <span className="pill"><i className="ri-check-line" />Assistido</span>}
      </>}
    >
      <Versions item={movie} idField="stream_id" onPick={onPickVersion} />
      <div style={{ display: 'flex', gap: 10, margin: '4px 0 18px' }}>
        <button className="btn btn--primary" style={{ flex: 1 }} onClick={() => onPlay(movie)}>
          <i className="ri-play-fill" />{inProgress ? `Continuar de ${fmtClock(p.time)}` : 'Assistir'}
        </button>
        {inProgress && <button className="btn btn--ghost" onClick={() => onPlay(movie, true)} aria-label="Assistir do início"><i className="ri-restart-line" /></button>}
      </div>
      {inProgress && (
        <div style={{ marginBottom: 18 }}>
          <div className="track"><span style={{ width: pct + '%' }} /></div>
          <div className="resume__foot"><span>{pct}% assistido</span><span>{fmtLeft(p.duration - p.time)}</span></div>
        </div>
      )}
      {loading ? <Spinner /> : (
        <>
          <Plot text={meta.plot || meta.description} />
          {meta.genre && <p className="detail__facts"><b>Gênero</b> {meta.genre}</p>}
          {meta.director && <p className="detail__facts"><b>Direção</b> {meta.director}</p>}
          {(meta.cast || meta.actors) && <p className="detail__facts clamp-2"><b>Elenco</b> {meta.cast || meta.actors}</p>}
        </>
      )}
    </DetailShell>
  );
}

function Field({ label, value, onChange, type = 'text', placeholder, right }) {
  const [focused, setFocused] = useState(false);

  return (
    <div className={'field' + (up ? ' is-up' : '') + (right ? ' field--btn' : '')}>
      <input value={value} onChange={onChange} type={type} autoComplete="off" autoCapitalize="none" autoCorrect="off" spellCheck="false"

function LoginScreen() {
  const { login } = useAuth();
  const [name, setName] = useState('');
  const [server, setServer] = useState('');
  const [user, setUser] = useState('');
  const [pass, setPass] = useState('');
  const [showPass, setShowPass] = useState(false);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);
  const [shake, setShake] = useState(false);

  function fail(msg) { setError(msg); setShake(true); setTimeout(() => setShake(false), 420); }

  async function submit(e) {
    e.preventDefault();
    if (!server || !user || !pass) { fail('Preencha servidor, usuário e senha.'); return; }
    setLoading(true); setError(null);
    try { await login(name, server, user, pass); }
    catch (err) { fail(err.message === 'auth_failed' ? 'Usuário ou senha não conferem.' : 'O servidor não respondeu. Confira o endereço e a conexão.'); }
    finally { setLoading(false); }
  }

  return (
    <>
      <div className="aurora"><i /><i /><i /></div>
      <div className="login">
        <div className={'login__card' + (shake ? ' is-shake' : '')}>
          <div className="login__brand"><Logo size={64} /><Wordmark height={34} /></div>
          <p className="login__sub">Entre com os dados da sua playlist Xtream</p>
          <form onSubmit={submit}>
            <Field label="Nome da playlist (opcional)" value={name} onChange={(e) => setName(e.target.value)} />
            <Field label="Endereço do servidor" value={server} onChange={(e) => setServer(e.target.value)} placeholder="http://dominio.com:8080" />
            <Field label="Usuário" value={user} onChange={(e) => setUser(e.target.value)} />
            <Field label="Senha" value={pass} onChange={(e) => setPass(e.target.value)} type={showPass ? 'text' : 'password'}
              right={<button type="button" className="field__btn" onClick={() => setShowPass((s) => !s)} aria-label={showPass ? 'Ocultar senha' : 'Mostrar senha'}><i className={showPass ? 'ri-eye-off-line' : 'ri-eye-line'} /></button>} />
            {error && <div className="alert"><i className="ri-error-warning-fill" /><span>{error}</span></div>}
            <button className="btn btn--primary btn--block" style={{ marginTop: 8 }} disabled={loading} type="submit">
              {loading && <span className="spinner" style={{ width: 18, height: 18, borderWidth: 2, borderTopColor: '#fff', borderRightColor: '#fff' }} />}
              {loading ? 'Conectando' : 'Entrar'}
            </button>
          </form>
          <p className="login__note">Seus dados ficam salvos só neste aparelho.</p>
        </div>
      </div>
    </>
  );
}

function AppContent() {
  const { session, logout } = useAuth();
  const { loading, error, data, done, fetchSeriesInfo, fetchMovieInfo, reload } = useXtream(session);
  const progress = useProgress();
  const { history, add: addHistory, clear: clearHistory } = useSearchHistory();
  const { list: favoritesList, isFavorite, toggle: toggleFavorite } = useFavorites();
  const [prefs, setPrefs] = usePrefs();
  const charts = useCharts(data);

  const [tab, setTabRaw] = useState('home');
  const [cat, setCat] = useState({ movie: null, series: null, live: null });
  const [playable, setPlayable] = useState(null);
  const [openSeries, setOpenSeries] = useState(null); // { series, focusEpisodeId }
  const [openMovie, setOpenMovie] = useState(null);
  const [settingsOpen, setSettingsOpen] = useState(false);
  const [menuFor, setMenuFor] = useState(null);
  const [searchSeed, setSearchSeed] = useState('');
  const extraRef = useRef({}); // dados resolvidos depois do play (próximo episódio, temporada)

  const setTab = useCallback((t) => { setTabRaw(t); window.scrollTo(0, 0); }, []);
  const overlay = !!(playable || openSeries || openMovie || settingsOpen || menuFor);
  useEffect(() => { document.body.classList.toggle('locked', overlay); return () => document.body.classList.remove('locked'); }, [overlay]);

  useEffect(() => {
    function onKey(e) {
      if (e.key !== 'Escape') return;
      if (playable) setPlayable(null);
      else if (openSeries) setOpenSeries(null);
      else if (openMovie) setOpenMovie(null);
    }
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [playable, openSeries, openMovie]);

  const cred = session ? `${encodeURIComponent(session.user)}/${encodeURIComponent(session.pass)}` : '';

  function resumePoint(key) {
    const p = progress.get(key);
    return p && !p.watched && p.time > 3 ? p.time : 0;
  }

  function playMovie(item, fromStart) {
    const ext = item.container_extension || 'mp4';
    const key = `movie-${item.stream_id}`;
    setPlayable({
      key, url: `${session.server}/movie/${cred}/${item.stream_id}.${ext}`,
      title: item.name, resumeAt: fromStart ? 0 : resumePoint(key),
      meta: { type: 'movie', id: item.stream_id, title: item.name, poster: item.stream_icon || '', ext },
    });
  }

  const liveUrl = (item) => `${session.server}/live/${cred}/${item.stream_id}.m3u8`;
  function playLive(item) {
    idbSet('lastLive', item.stream_id).catch(() => {});
    setPlayable({ key: `live-${item.stream_id}`, url: liveUrl(item), title: item.name, isLive: true, resumeAt: 0 });
  }

  // r: { id, seriesId, seriesName, cover, season, episodeNum, epTitle, ext, nextEp }
  function playEpisode(r) {
    const key = `episode-${r.id}`;
    const ext = r.ext || 'mp4';
    const meta = { type: 'episode', id: r.id, seriesId: r.seriesId, title: r.seriesName, poster: r.cover || '', ext };
    if (r.season != null) meta.season = r.season;
    if (r.episodeNum != null) meta.episodeNum = r.episodeNum;
    if (r.epTitle) meta.epTitle = r.epTitle;
    if (r.nextEp !== undefined) meta.nextEp = r.nextEp;

    // Sem "próximo episódio" conhecido (ex.: progresso antigo)? Descobre em segundo plano.
    if (r.nextEp === undefined || r.season == null) {
      fetchSeriesInfo(r.seriesId).then((info) => {
        const flat = flattenEpisodes(info);
        const idx = flat.findIndex((f) => String(f.ep.id) === String(r.id));
        if (idx < 0) return;
        const nx = flat[idx + 1];
        extraRef.current[key] = {
          season: flat[idx].season, episodeNum: flat[idx].ep.episode_num, epTitle: flat[idx].ep.title || '',
          nextEp: nx ? nextRef(nx.ep, nx.season) : null,
        };
      }).catch(() => {});
    }

    const label = r.season != null ? `T${r.season} E${r.episodeNum}` : (r.episodeNum != null ? `Ep. ${r.episodeNum}` : '');
    setPlayable({
      key, url: `${session.server}/series/${cred}/${r.id}.${ext}`,
      title: r.seriesName, subtitle: [label, r.epTitle ? cleanEpTitle(r.epTitle, r.seriesName, r.episodeNum) : ''].filter(Boolean).join(' '),
      resumeAt: resumePoint(key), meta,
    });
  }

  const handleProgress = useCallback((pl, time, duration) => {
    if (!pl.meta) return;
    const now = Date.now();
    progress.save(pl.key, {
      ...pl.meta, ...(extraRef.current[pl.key] || {}),
      time, duration, watched: duration > 0 && time / duration >= WATCHED_AT,
      playedAt: now, updatedAt: now,
    });
  }, [progress.save]);

  function openItem(item, kind) {
    if (kind === 'series') setOpenSeries({ series: item });
    else if (kind === 'movie') setOpenMovie(item);
    else if (kind === 'live') playLive(item);
  }

  function findSeries(p) {
    return data.seriesAll.find((s) => String(s.series_id) === String(p.seriesId)) || { series_id: p.seriesId, name: p.title, cover: p.poster };
  }
  function findMovie(p) {
    return data.movieAll.find((m) => String(m.stream_id) === String(p.id)) || { stream_id: p.id, name: p.title, stream_icon: p.poster, container_extension: p.ext };
  }

  function resumeEntry(entry) {
    const p = entry.p;
    if (p.type === 'movie') { playMovie(findMovie(p)); return; }
    playEpisode({
      id: p.id, seriesId: p.seriesId, seriesName: p.title, cover: p.poster, season: p.season, episodeNum: p.episodeNum,
      epTitle: p.epTitle, ext: p.ext, nextEp: p.nextEp,
    });
  }
  function detailsForEntry(entry) {
    const p = entry.p;
    if (p.type === 'movie') setOpenMovie(findMovie(p));
    else setOpenSeries({ series: findSeries(p), focusEpisodeId: p.id });
  }
  function removeEntry(entry) {
    if (entry.p.type === 'movie') progress.remove(entry.p.key);
    else progress.dismissSeries(entry.p.seriesId);
  }

  function toggleWatched(f, series, cover) {
    const key = `episode-${f.ep.id}`;
    const p = progress.get(key);
    if (p && p.watched) {
      progress.save(key, { watched: false, time: 0, updatedAt: Date.now() });
    } else {
      progress.save(key, {
        type: 'episode', id: f.ep.id, seriesId: series.series_id, title: series.name, poster: cover,
        season: f.season, episodeNum: f.ep.episode_num, epTitle: f.ep.title || '', ext: f.ep.container_extension || 'mp4',
        watched: true, playedAt: (p && p.playedAt) || 0, updatedAt: Date.now(),
      });
    }
  }

  // Tudo o que está em alta nas plataformas E existe na playlist, sem repetir título.
  // Percorre os rankings por posição (todos os 1º lugares, depois os 2º...) para misturar as plataformas.
  const trendMine = useMemo(() => {
    if (!data) return [];
    const c = charts.charts, out = [], seen = new Set();
    const lists = [];
    for (const p of PLATFORMS) {
      const off = c.official && c.official[p.id];
      const day = c.daily && c.daily[p.id];
      if (off) lists.push({ p, label: `Top 10 da ${p.name}`, rows: [uniqEntries(off.series), uniqEntries(off.movies)] });
      if (day) lists.push({ p, label: `Em alta: ${p.name}`, rows: [uniqEntries(day.series), uniqEntries(day.movies)] });
    }
    for (let i = 0; i < 10; i++) {
      for (const l of lists) for (const arr of l.rows) {
        const entry = arr[i];
        if (!entry) continue;
        const item = charts.match(entry);
        if (!item) continue;
        const k = entry.kind + item._k;
        if (seen.has(k)) continue;
        seen.add(k);
        out.push({ item, kind: entry.kind, plat: l.p, label: l.label });
      }
    }
    return out;
  }, [data, charts.charts, charts.match]);

  // Monta o Início de cima para baixo; um título que já apareceu não volta em outra fileira.
  const home = useMemo(() => {
    if (!data) return null;
    const used = new Set();
    const img = (it) => it.stream_icon || it.cover;
    const take = (list, kind, n, needImg) => {
      const out = [];
      for (const it of list) {
        if (out.length >= n) break;
        const k = kind + it._k;
        if (used.has(k) || (needImg && !img(it))) continue;
        used.add(k); out.push(it);
      }
      return out;
    };
    const hero = [];
    for (const t of trendMine) {
      if (hero.length >= 5) break;
      if (!img(t.item)) continue;
      used.add(t.kind + t.item._k);
      hero.push({ item: t.item, kind: t.kind, label: t.label });
    }
    if (hero.length < 5) {
      const fm = take(data.movieNew, 'movie', 5, true), fs = take(data.seriesNew, 'series', 5, true);
      for (let i = 0; hero.length < 5 && (fm[i] || fs[i]); i++) {
        if (fm[i]) hero.push({ item: fm[i], kind: 'movie' });
        if (fs[i] && hero.length < 5) hero.push({ item: fs[i], kind: 'series' });
      }
    }
    const trend = [];
    for (const t of trendMine) {
      if (trend.length >= 16) break;
      const k = t.kind + t.item._k;
      if (used.has(k)) continue;
      used.add(k); trend.push(t);
    }
    const newMovies = take(data.movieNew, 'movie', 18);
    const newSeries = take(data.seriesNew, 'series', 18);
    const mc = data.movieCats.filter((c) => (data.movieByCat.get(String(c.category_id)) || []).length > 0);
    const sc = data.seriesCats.filter((c) => (data.seriesByCat.get(String(c.category_id)) || []).length > 0);
    const catRows = [];
    for (let i = 0; i < 4; i++) {
      if (mc[i]) catRows.push({ c: mc[i], kind: 'movie', tab: 'movies', items: take(data.movieByCat.get(String(mc[i].category_id)), 'movie', 16) });
      if (sc[i] && i < 3) catRows.push({ c: sc[i], kind: 'series', tab: 'series', items: take(data.seriesByCat.get(String(sc[i].category_id)), 'series', 16) });
    }
    const tiles = [
      ...mc.slice(0, 8).map((c) => ({ c, kind: 'movie', tab: 'movies', icon: 'ri-film-line' })),
      ...sc.slice(0, 6).map((c) => ({ c, kind: 'series', tab: 'series', icon: 'ri-tv-2-line' })),
    ];
    return { hero, trend, newMovies, newSeries, catRows: catRows.filter((r) => r.items.length >= 4), tiles };
  }, [data, trendMine]);

  if (loading) return <Splash status={done < 6 ? `Carregando catálogo ${done} de 6` : 'Organizando sua playlist'} progress={done / 6} />;
  if (error) return (
    <div className="fatal">
      <div className="empty__ico"><i className="ri-wifi-off-line" /></div>
      <p style={{ maxWidth: '30ch' }}>{error}</p>
      <button className="btn btn--primary" onClick={reload}><i className="ri-refresh-line" />Tentar de novo</button>
      <button className="btn btn--ghost btn--sm" onClick={logout}>Usar outra playlist</button>
    </div>
  );
  if (!data) return null;

  const goCat = (tabId, kind) => (id) => { setCat((c) => ({ ...c, [kind]: id })); setTab(tabId); };
  const setKindCat = (kind) => (id) => setCat((c) => ({ ...c, [kind]: id }));
  const openFav = (f) => {
    if (f.type === 'movie') setOpenMovie(findMovie({ id: f.id, title: f.name, poster: f.poster, ext: f.container_extension }));
    else setOpenSeries({ series: findSeries({ seriesId: f.id, title: f.name, poster: f.poster }) });
  };

  return (
    <>
      <Header tab={tab} setTab={setTab} onSearchOpen={() => setSearchSeed('')} onOpenSettings={() => setSettingsOpen(true)} initial={(session.name || 'N').trim().charAt(0).toUpperCase()} />

      {tab === 'home' && (
        <div className="page page--home">
          <Hero items={home.hero} onPlay={(m) => playMovie(m)} onOpen={openItem} />
          {progress.continueList.length > 0 && (
            <Row title="Continuar assistindo">
              {progress.continueList.map((entry) => (
                <ContinueCard key={entry.p.key} entry={entry} onPlay={() => resumeEntry(entry)} onMenu={() => setMenuFor(entry)} />
              ))}
            </Row>
          )}
          <Row title="Em alta que você tem" sub="Dos rankings das plataformas, direto na sua playlist" onMore={() => setTab('trending')}>
            {home.trend.map((t) => (
              <Poster key={t.kind + (t.item.stream_id || t.item.series_id)} large item={t.item} kind={t.kind}
                tag={<><i className="dot" style={{ background: t.plat.color }} />{t.plat.name}</>} onClick={() => openItem(t.item, t.kind)} />
            ))}
          </Row>
          {favoritesList.length > 0 && (
            <Row title="Minha lista" onMore={() => setTab('favorites')}>
              {favoritesList.slice(0, 18).map((f) => (
                <Poster key={`${f.type}-${f.id}`} item={{ name: f.name, stream_icon: f.poster }} onClick={() => openFav(f)} />
              ))}
            </Row>
          )}
          <Row title="Filmes recém-chegados" onMore={() => setTab('movies')}>
            {home.newMovies.map((m) => <Poster key={m.stream_id} item={m} kind="movie" onClick={() => openItem(m, 'movie')} />)}
          </Row>
          <Row title="Séries recém-chegadas" onMore={() => setTab('series')}>
            {home.newSeries.map((x) => <Poster key={x.series_id} item={x} kind="series" onClick={() => openItem(x, 'series')} />)}
          </Row>
          {home.catRows.map((r) => (
            <Row key={r.kind + r.c.category_id} title={r.c.category_name} onMore={() => goCat(r.tab, r.kind)(r.c.category_id)}>
              {r.items.map((it) => <Poster key={it.stream_id || it.series_id} item={it} kind={r.kind} onClick={() => openItem(it, r.kind)} />)}
            </Row>
          ))}
          {home.tiles.length > 0 && (
            <section className="row">
              <div className="row__head"><h2 className="row__title">Explorar por categoria</h2></div>
              <div className="tiles">
                {home.tiles.map((t) => (
                  <button key={t.kind + t.c.category_id} className="tile" onClick={() => goCat(t.tab, t.kind)(t.c.category_id)}>
                    <i className={t.icon} /><span className="clamp-2">{t.c.category_name}</span>
                  </button>
                ))}
              </div>
            </section>
          )}
        </div>
      )}

      {tab === 'movies' && <Browse title="Filmes" kind="movie" items={data.movies} cats={data.movieCats} byCat={data.movieByCat} selected={cat.movie} onSelect={setKindCat('movie')} onOpen={openItem} />}
      {tab === 'series' && <Browse title="Séries" kind="series" items={data.series} cats={data.seriesCats} byCat={data.seriesByCat} selected={cat.series} onSelect={setKindCat('series')} onOpen={openItem} />}
      {tab === 'live' && <Live data={data} session={session} liveUrl={liveUrl} selected={cat.live} onSelect={setKindCat('live')} onPlay={playLive} previewOn={prefs.livePreview} suspended={!!playable} />}
      {tab === 'trending' && <Trending charts={charts} onOpen={openItem} onSearch={(t) => { setSearchSeed(t.split(/\s[-:]\s|:\s/)[0]); setTab('search'); }} />}

      {tab === 'favorites' && (
        <div className="page">
          <h1 className="page__title">Favoritos</h1>
          {favoritesList.length === 0 ? (
            <div className="empty">
              <div className="empty__ico"><i className="ri-heart-3-line" /></div>
              <h3>Sua lista está vazia</h3>
              <p>Toque no coração dentro de um filme ou série para guardar aqui.</p>
              <button className="btn btn--ghost btn--sm" style={{ marginTop: 8 }} onClick={() => setTab('home')}>Explorar o catálogo</button>
            </div>
          ) : (
            <div className="grid" style={{ marginTop: 12 }}>
              {favoritesList.map((f) => (
                <Poster key={`${f.type}-${f.id}`} grid item={{ name: f.name, stream_icon: f.poster }} tag={f.type === 'movie' ? 'Filme' : 'Série'}
                  onClick={() => openFav(f)} />
              ))}
            </div>
          )}
        </div>
      )}

      {tab === 'search' && <SearchScreen key={searchSeed} seed={searchSeed} data={data} onOpen={openItem} history={history} addHistory={addHistory} clearHistory={clearHistory} />}

      <BottomNav tab={tab} setTab={setTab} />

      {openSeries && (
        <SeriesDetail key={openSeries.series.series_id} series={openSeries.series} focusEpisodeId={openSeries.focusEpisodeId}
          fetchSeriesInfo={fetchSeriesInfo} onClose={() => setOpenSeries(null)} onPlayEpisode={playEpisode} onToggleWatched={toggleWatched}
          progressMap={progress.map} isFavorite={isFavorite} onToggleFavorite={toggleFavorite} onPickVersion={(v) => setOpenSeries({ series: v })} />
      )}
      {openMovie && (
        <MovieDetail key={openMovie.stream_id} movie={openMovie} fetchMovieInfo={fetchMovieInfo} onClose={() => setOpenMovie(null)}
          onPlay={playMovie} progressMap={progress.map} isFavorite={isFavorite} onToggleFavorite={toggleFavorite} onPickVersion={setOpenMovie} />
      )}
      {playable && <Player playable={playable} onProgress={(t, d) => handleProgress(playable, t, d)} onClose={() => setPlayable(null)} />}

      {menuFor && (
        <Sheet onClose={() => setMenuFor(null)}>
          {(close) => (
            <>
              <div className="sheet__item">
                <div className="sheet__thumb"><div className="ph" style={{ fontSize: 18 }}><i className="ri-film-line" /></div><Art src={menuFor.p.poster} /></div>
                <div style={{ minWidth: 0 }}>
                  <p className="clamp-1" style={{ fontWeight: 700, fontSize: 16 }}>{menuFor.p.title}</p>
                  <p className="clamp-1" style={{ color: 'var(--mute)', fontSize: 13 }}>
                    {menuFor.p.type === 'episode' ? epLabel(menuFor.p) : 'Filme'}{menuFor.p.duration > 0 && menuFor.p.time > 0 ? `, parou em ${fmtClock(menuFor.p.time)}` : ''}
                  </p>
                </div>
              </div>
              <button className="act" onClick={() => { const e = menuFor; close(); resumeEntry(e); }}><i className="ri-play-fill" />{menuFor.kind === 'next' ? 'Assistir próximo episódio' : 'Continuar assistindo'}</button>
              <button className="act" onClick={() => { const e = menuFor; close(); detailsForEntry(e); }}><i className="ri-information-line" />{menuFor.p.type === 'episode' ? 'Ver episódios' : 'Ver detalhes'}</button>
              <button className="act act--danger" onClick={() => { const e = menuFor; close(); removeEntry(e); }}><i className="ri-close-circle-line" />Tirar de Continuar assistindo</button>
            </>
          )}
        </Sheet>
      )}

      {settingsOpen && <SettingsSheet onClose={() => setSettingsOpen(false)} session={session} data={data} onLogout={logout} onReload={reload} prefs={prefs} setPrefs={setPrefs} />}
    </>
  );
}

/* ============================== Onboarding ============================== */
function useOnboarding() {
  const [seen, setSeen] = useState(null);
  useEffect(() => { idbGet('onboarding_seen').then((v) => setSeen(!!v)).catch(() => setSeen(false)); }, []);
  const complete = useCallback(() => { idbSet('onboarding_seen', true); setSeen(true); }, []);
  return { seen, complete };
}

const ONBOARDING_STEPS = [
  { icon: null, title: 'Sua noite de cinema começa aqui', text: 'O Nyx organiza sua playlist Xtream em um catálogo bonito de navegar.' },
  { icon: 'ri-search-2-line', title: 'Ache qualquer título em segundos', text: 'Filmes, séries e canais por categoria, com uma busca que responde enquanto você digita.' },
  { icon: 'ri-history-line', title: 'Volte exatamente de onde parou', text: 'O Nyx guarda o minuto, o episódio e a temporada. É só apertar play.' },
];

function Onboarding({ onDone }) {
  const [step, setStep] = useState(0);
  const touchX = useRef(null);
  const last = step === ONBOARDING_STEPS.length - 1;
  const next = () => (last ? onDone() : setStep((s) => s + 1));
  const back = () => setStep((s) => Math.max(0, s - 1));
  const s = ONBOARDING_STEPS[step];
  return (
    <>
      <div className="aurora"><i /><i /><i /></div>
      <div className="onb"
        onTouchStart={(e) => { touchX.current = e.touches[0].clientX; }}
        onTouchEnd={(e) => {
          if (touchX.current === null) return;
          const dx = e.changedTouches[0].clientX - touchX.current;
          if (dx < -40) next(); else if (dx > 40) back();
          touchX.current = null;
        }}>
        <button className="onb__skip" onClick={onDone} style={{ visibility: last ? 'hidden' : 'visible' }}>Pular</button>
        <div className="onb__mid" key={step}>
          <div className="onb__ico">{s.icon ? <i className={s.icon} /> : <Logo size={76} />}</div>
          <h1>{s.title}</h1>
          <p>{s.text}</p>
        </div>
        <div className="onb__dots">{ONBOARDING_STEPS.map((_, i) => <i key={i} className={i === step ? 'is-on' : ''} />)}</div>
        <button className="btn btn--primary btn--block" onClick={next}>{last ? 'Conectar minha playlist' : 'Continuar'}</button>
      </div>
    </>
  );
}

function Root() {
  const { session, ready } = useAuth();
  const { seen, complete } = useOnboarding();
  if (!ready || seen === null) return <Splash />;
  if (session) return <AppContent />;
  if (!seen) return <Onboarding onDone={complete} />;
  return <LoginScreen />;
}

ReactDOM.createRoot(document.getElementById('root')).render(<AuthProvider><Root /></AuthProvider>);
</script>
