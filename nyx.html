<style>
  :root {
    --bg: #090716;
    --bg-2: #0e0b20;
    --surf: #15112e;
    --surf-2: #1d183d;
    --surf-3: #272050;
    --line: rgba(190, 180, 255, .11);
    --line-2: rgba(190, 180, 255, .2);
    --text: #eeebff;
    --mute: rgba(228, 223, 255, .64);
    --dim: rgba(228, 223, 255, .4);
    --vio: #9b6dff;
    --blue: #4f9dff;
    --grad: linear-gradient(135deg, #a877ff 0%, #7480ff 52%, #4f9dff 100%);
    --danger: #ff6b8e;
    --ok: #6fe3c1;
    --r-s: 10px;
    --r-m: 16px;
    --r-l: 26px;
    --sat: env(safe-area-inset-top, 0px);
    --sab: env(safe-area-inset-bottom, 0px);
    --hh: 56px;
    --pad: 16px;
    --display: "Bricolage Grotesque", "Figtree", system-ui, sans-serif;
    --body: "Figtree", system-ui, -apple-system, sans-serif;
    box-sizing: border-box;
  }
  @media (min-width: 860px) { :root { --pad: 40px; --hh: 64px; } }

  *, *::before, *::after { box-sizing: inherit; }
  html, body { height: 100%; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: var(--body); font-size: 15px; line-height: 1.45;
    -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
    overscroll-behavior-y: none;
  }
  body.locked { overflow: hidden; }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background:
      radial-gradient(60% 40% at 12% -5%, rgba(155, 109, 255, .22), transparent 70%),
      radial-gradient(50% 35% at 100% 0%, rgba(79, 157, 255, .14), transparent 70%);
  }
  #root { position: relative; z-index: 1; min-height: 100%; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  input { font: inherit; color: inherit; }
  h1, h2, h3, p { margin: 0; }
  img { display: block; }
  .noscroll::-webkit-scrollbar { display: none; }
  .noscroll { scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .clamp-1 { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .clamp-3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

  /* ---------- motion ---------- */
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes sheet-in { from { transform: translateY(100%); } to { transform: none; } }
  @keyframes sheet-out { from { transform: none; } to { transform: translateY(100%); } }
  @keyframes page-in { from { opacity: 0; transform: translateY(28px) scale(.985); } to { opacity: 1; transform: none; } }
  @keyframes shake { 10%,90%{transform:translateX(-1px)} 20%,80%{transform:translateX(2px)} 30%,50%,70%{transform:translateX(-5px)} 40%,60%{transform:translateX(5px)} }
  @keyframes halo { 0%,100% { opacity: .55; transform: scale(1); } 50% { opacity: 1; transform: scale(1.12); } }
  @keyframes drift-a { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(12%, 8%) scale(1.15); } }
  @keyframes drift-b { 0%,100% { transform: translate(0,0) scale(1.1); } 50% { transform: translate(-10%, -12%) scale(.95); } }
  @keyframes indet { 0% { left: -40%; } 100% { left: 100%; } }
  @keyframes here { 0%,100% { box-shadow: 0 0 0 1px var(--vio), 0 0 0 0 rgba(155,109,255,.45); } 50% { box-shadow: 0 0 0 1px var(--vio), 0 0 0 8px rgba(155,109,255,0); } }
  @keyframes swipe-next { from { opacity: 0; transform: translateX(46px); } to { opacity: 1; transform: none; } }
  @keyframes swipe-prev { from { opacity: 0; transform: translateX(-46px); } to { opacity: 1; transform: none; } }
  @keyframes eq { 0%,100% { transform: scaleY(.35); } 50% { transform: scaleY(1); } }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  @keyframes twinkle { 0%,100% { opacity: .15; } 50% { opacity: .9; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }

  /* ---------- brand ---------- */
  .brand { display: inline-flex; align-items: center; gap: 10px; }
  .brand__word { font-family: var(--display); font-weight: 800; font-size: 24px; letter-spacing: -.04em; line-height: 1; }
  .gradtext { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }

  /* ---------- splash ---------- */
  .splash { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; background: var(--bg); overflow: hidden; }
  .splash__stars { position: absolute; inset: 0; }
  .splash__stars i { position: absolute; width: 2px; height: 2px; border-radius: 50%; background: #fff; animation: twinkle 3s ease-in-out infinite; }
  .splash__moon { position: relative; width: 132px; height: 132px; display: grid; place-items: center; }
  .splash__moon::before { content: ""; position: absolute; inset: -30px; border-radius: 50%; background: radial-gradient(circle, rgba(155,109,255,.5), rgba(79,157,255,.14) 45%, transparent 68%); animation: halo 2.6s ease-in-out infinite; }
  .splash__orbit { position: absolute; inset: 0; border-radius: 50%; border: 1px solid var(--line); animation: spin 3.2s linear infinite; }
  .splash__orbit::after { content: ""; position: absolute; top: -4px; left: 50%; width: 8px; height: 8px; margin-left: -4px; border-radius: 50%; background: var(--blue); box-shadow: 0 0 14px 2px var(--blue); }
  .splash__word { font-family: var(--display); font-weight: 800; font-size: 44px; letter-spacing: -.05em; line-height: 1; animation: rise .7s .15s both; }
  .splash__status { color: var(--mute); font-size: 13.5px; min-height: 20px; animation: fade .6s .4s both; }
  .bar { position: relative; width: 168px; height: 3px; border-radius: 3px; background: rgba(255,255,255,.1); overflow: hidden; }
  .bar > span { position: absolute; top: 0; bottom: 0; left: 0; border-radius: 3px; background: var(--grad); transition: width .35s ease; }
  .bar--indet > span { width: 40%; animation: indet 1.1s ease-in-out infinite; }

  .spinner { width: 34px; height: 34px; border-radius: 50%; border: 2.5px solid rgba(255,255,255,.12); border-top-color: var(--vio); border-right-color: var(--blue); animation: spin .8s linear infinite; }
  .center-pad { display: flex; justify-content: center; padding: 56px 0; }

  /* ---------- buttons ---------- */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 48px; padding: 0 22px; border-radius: 14px; font-weight: 600; font-size: 15px; transition: transform .15s, filter .15s, background .15s; white-space: nowrap; }
  .btn:active { transform: scale(.97); }
  .btn i { font-size: 20px; }
  .btn--primary { background: var(--grad); color: #fff; box-shadow: 0 10px 30px -8px rgba(124, 108, 255, .7); }
  .btn--primary:hover { filter: brightness(1.1); }
  .btn--ghost { background: rgba(255,255,255,.09); border: 1px solid var(--line); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  .btn--ghost:hover { background: rgba(255,255,255,.15); }
  .btn--danger { background: rgba(255,107,142,.14); color: var(--danger); border: 1px solid rgba(255,107,142,.3); }
  .btn--block { width: 100%; }
  .btn--sm { height: 40px; padding: 0 16px; font-size: 14px; border-radius: 12px; }
  .btn[disabled] { opacity: .65; pointer-events: none; }
  .iconbtn { width: 42px; height: 42px; flex: none; border-radius: 50%; display: grid; place-items: center; font-size: 20px; color: var(--text); background: rgba(255,255,255,.07); border: 1px solid var(--line); transition: background .15s, transform .15s; }
  .iconbtn:hover { background: rgba(255,255,255,.14); }
  .iconbtn:active { transform: scale(.92); }
  .iconbtn--glass { background: rgba(9,7,22,.55); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
  .iconbtn.is-on { background: var(--grad); border-color: transparent; }

  /* ---------- header + nav ---------- */
  .header { position: fixed; top: 0; left: 0; right: 0; z-index: 30; padding-top: var(--sat); transition: background .25s, border-color .25s; border-bottom: 1px solid transparent; }
  .header.is-solid { background: rgba(9,7,22,.78); backdrop-filter: blur(18px) saturate(1.4); -webkit-backdrop-filter: blur(18px) saturate(1.4); border-bottom-color: var(--line); }
  .header__in { height: var(--hh); display: flex; align-items: center; gap: 12px; padding: 0 var(--pad); }
  .header__tabs { display: none; flex: 1; gap: 4px; margin-left: 20px; }
  .header__tab { padding: 8px 14px; border-radius: 99px; font-size: 14.5px; font-weight: 500; color: var(--mute); transition: color .15s, background .15s; }
  .header__tab:hover { color: var(--text); }
  .header__tab.is-on { color: #fff; background: rgba(255,255,255,.1); }
  .header__sp { flex: 1; }
  @media (min-width: 860px) { .header__tabs { display: flex; } .header__sp { display: none; } }

  .nav { position: fixed; z-index: 30; left: 8px; right: 8px; bottom: calc(10px + var(--sab)); display: flex; padding: 6px; border-radius: 24px; background: rgba(21,17,46,.82); backdrop-filter: blur(22px) saturate(1.5); -webkit-backdrop-filter: blur(22px) saturate(1.5); border: 1px solid var(--line-2); box-shadow: 0 18px 40px -10px rgba(0,0,0,.7); }
  .nav__item { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 7px 1px 6px; border-radius: 18px; color: var(--dim); font-size: 10px; font-weight: 600; transition: color .2s, background .2s; }
  .nav__item i { font-size: 21px; line-height: 1; transition: transform .25s cubic-bezier(.3,1.6,.5,1); }
  .nav__item.is-on { color: #fff; background: linear-gradient(135deg, rgba(168,119,255,.3), rgba(79,157,255,.22)); }
  .nav__item.is-on i { transform: translateY(-1px) scale(1.12); }
  @media (min-width: 860px) { .nav { display: none; } }

  .page { padding-top: calc(var(--sat) + var(--hh)); padding-bottom: calc(110px + var(--sab)); min-height: 100vh; }
  .page--home { padding-top: 0; }
  .page__title { font-family: var(--display); font-weight: 700; font-size: 30px; letter-spacing: -.03em; padding: 14px var(--pad) 4px; }

  /* ---------- hero ---------- */
  .hero { position: relative; height: min(74vh, 600px); min-height: 470px; overflow: hidden; margin-bottom: 8px; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
  .hero__in--next { animation: swipe-next .32s cubic-bezier(.2,.8,.2,1) both; }
  .hero__in--prev { animation: swipe-prev .32s cubic-bezier(.2,.8,.2,1) both; }
  .hero__arrow { display: none; position: absolute; top: 50%; z-index: 2; transform: translateY(-50%); }
  .hero__arrow--l { left: 12px; } .hero__arrow--r { right: 12px; }
  @media (min-width: 860px) and (hover: hover) { .hero__arrow { display: grid; } }
  .hero__bg { position: absolute; inset: -30px; background-size: cover; background-position: center 25%; filter: blur(26px) saturate(1.35) brightness(.8); transform: scale(1.12); opacity: 0; transition: opacity .9s ease; }
  .hero__bg.is-on { opacity: 1; }
  .hero__shade { position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(9,7,22,.55) 0%, rgba(9,7,22,.1) 30%, rgba(9,7,22,.72) 68%, var(--bg) 100%); }
  .hero__in { position: absolute; left: 0; right: 0; bottom: 0; padding: 0 var(--pad) 18px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px; }
  .hero__poster { width: 150px; aspect-ratio: 2/3; border-radius: 18px; overflow: hidden; position: relative; background: var(--surf); box-shadow: 0 30px 60px -18px rgba(0,0,0,.85), 0 0 0 1px rgba(255,255,255,.12); animation: rise .6s both; }
  .hero__title { font-family: var(--display); font-weight: 800; font-size: clamp(26px, 7vw, 46px); line-height: 1.02; letter-spacing: -.035em; max-width: 16ch; text-wrap: balance; animation: rise .6s .06s both; }
  .hero__meta { display: flex; align-items: center; gap: 10px; color: var(--mute); font-size: 13.5px; animation: rise .6s .1s both; }
  .hero__actions { display: flex; gap: 10px; animation: rise .6s .14s both; }
  .hero__dots { display: flex; gap: 6px; margin-top: 2px; }
  .hero__dots button { width: 6px; height: 6px; border-radius: 6px; background: rgba(255,255,255,.25); transition: width .3s, background .3s; }
  .hero__dots button.is-on { width: 22px; background: var(--grad); }
  @media (min-width: 860px) {
    .hero { height: min(78vh, 640px); }
    .hero__in { flex-direction: row; align-items: flex-end; text-align: left; gap: 32px; padding-bottom: 34px; }
    .hero__poster { width: 210px; flex: none; }
    .hero__txt { display: flex; flex-direction: column; gap: 14px; align-items: flex-start; padding-bottom: 6px; }
  }
  .hero__txt { display: contents; }
  @media (min-width: 860px) { .hero__txt { display: flex; } }

  .pill { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 9px; border-radius: 99px; font-size: 12px; font-weight: 600; background: rgba(255,255,255,.1); border: 1px solid var(--line); color: var(--text); }
  .pill i { font-size: 13px; }
  .pill--star i { color: #ffd166; }
  .pill--grad { background: var(--grad); border-color: transparent; color: #fff; }

  /* ---------- rows ---------- */
  .row { margin: 0 0 30px; }
  .row__head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 0 var(--pad); margin-bottom: 12px; }
  .row__title { font-family: var(--display); font-weight: 700; font-size: 19px; letter-spacing: -.02em; }
  .row__more { color: var(--mute); font-size: 13px; font-weight: 600; flex: none; }
  .row__more:hover { color: var(--text); }
  .row__track { display: flex; gap: 12px; overflow-x: auto; padding: 4px var(--pad) 6px; scroll-snap-type: x proximity; scroll-padding-left: var(--pad); }
  .row__track > * { scroll-snap-align: start; flex: none; }

  .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px 10px; padding: 0 var(--pad); }
  @media (min-width: 560px) { .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  @media (min-width: 860px) { .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 22px 16px; } }

  /* ---------- poster ---------- */
  .art { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .45s ease; }
  .art.on { opacity: 1; }
  .ph { position: absolute; inset: 0; display: grid; place-items: center; font-size: 26px; color: rgba(255,255,255,.16); background: linear-gradient(145deg, var(--surf-2), var(--surf)); }
  .poster { width: 124px; display: block; }
  .poster--grid { width: 100%; }
  .poster__art { position: relative; aspect-ratio: 2/3; border-radius: 14px; overflow: hidden; background: var(--surf); box-shadow: 0 0 0 1px rgba(255,255,255,.07), 0 12px 24px -14px rgba(0,0,0,.9); transition: transform .2s ease, box-shadow .2s ease; }
  @media (hover: hover) { .poster:hover .poster__art { transform: translateY(-4px); box-shadow: 0 0 0 1.5px var(--vio), 0 18px 30px -14px rgba(155,109,255,.55); } }
  .poster:active .poster__art { transform: scale(.96); }
  .poster__name { margin-top: 8px; font-size: 12.5px; line-height: 1.3; color: var(--mute); font-weight: 500; }
  .poster__tag { position: absolute; top: 7px; left: 7px; height: 20px; padding: 0 7px; border-radius: 6px; font-size: 10.5px; font-weight: 700; display: inline-flex; align-items: center; background: rgba(9,7,22,.75); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  .poster--live { width: 108px; }
  .poster--live.poster--grid { width: 100%; }
  .poster--live .poster__art { aspect-ratio: 1; }
  .poster--live .art { object-fit: contain; padding: 14%; }
  @media (min-width: 860px) { .poster { width: 156px; } .poster--live { width: 128px; } .poster__name { font-size: 13.5px; } }

  .row__sub { font-size: 12.5px; color: var(--mute); margin-top: 2px; }
  .poster--lg { width: 148px; }
  .poster--lg .poster__art { border-radius: 18px; }
  .poster--lg .poster__tag { top: auto; bottom: 8px; left: 8px; height: 24px; padding: 0 9px; border-radius: 99px; font-size: 11px; }
  .poster--lg .poster__tag i.dot { width: 7px; height: 7px; margin-right: 6px; box-shadow: none; }
  @media (min-width: 860px) { .poster--lg { width: 184px; } }
  .tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; padding: 0 var(--pad); }
  @media (min-width: 560px) { .tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (min-width: 860px) { .tiles { grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; } }
  .tile { display: flex; align-items: center; gap: 10px; min-height: 60px; padding: 10px 14px; border-radius: 16px; font-weight: 600; font-size: 13.5px; line-height: 1.2; background: linear-gradient(135deg, rgba(168,119,255,.17), rgba(79,157,255,.07)); border: 1px solid var(--line); transition: transform .15s, border-color .15s; }
  .tile:hover { border-color: var(--line-2); }
  .tile:active { transform: scale(.97); }
  .tile i { font-size: 19px; color: #cdbcff; flex: none; }
  .versions { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 16px; }

  /* ---------- continue cards ---------- */
  .cont { position: relative; width: 272px; }
  .cont__art { position: relative; display: block; width: 100%; aspect-ratio: 16/9; border-radius: 18px; overflow: hidden; background: var(--surf); box-shadow: 0 0 0 1px rgba(255,255,255,.09), 0 18px 34px -16px rgba(0,0,0,.9); }
  .cont__art .art { object-position: center 22%; }
  .cont__shade { position: absolute; inset: 0; background: linear-gradient(to top, rgba(9,7,22,.96) 4%, rgba(9,7,22,.35) 52%, rgba(9,7,22,.1)); }
  .cont__play { position: absolute; left: 14px; bottom: 44px; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-size: 19px; background: var(--grad); box-shadow: 0 8px 20px -4px rgba(124,108,255,.8); transition: transform .2s; }
  .cont__art:active .cont__play { transform: scale(.9); }
  .cont__info { position: absolute; left: 62px; right: 14px; bottom: 42px; }
  .cont__title { font-weight: 700; font-size: 14.5px; line-height: 1.2; }
  .cont__sub { display: flex; gap: 8px; font-size: 12px; color: var(--mute); margin-top: 2px; }
  .cont__sub b { color: #cdbcff; font-weight: 700; }
  .cont__bar { position: absolute; left: 14px; right: 14px; bottom: 14px; }
  .cont__left { position: absolute; left: 14px; bottom: 22px; right: 14px; font-size: 11px; color: var(--dim); display: flex; justify-content: space-between; }
  .cont__menu { position: absolute; top: 8px; right: 8px; width: 34px; height: 34px; font-size: 18px; }
  .track { height: 4px; border-radius: 4px; background: rgba(255,255,255,.16); overflow: hidden; }
  .track > span { display: block; height: 100%; border-radius: 4px; background: var(--grad); }

  /* ---------- chips ---------- */
  .chips { position: sticky; top: calc(var(--sat) + var(--hh)); z-index: 20; display: flex; gap: 8px; overflow-x: auto; padding: 10px var(--pad) 12px; background: linear-gradient(to bottom, var(--bg) 70%, transparent); margin-bottom: 8px; }
  .chip { flex: none; height: 36px; padding: 0 15px; border-radius: 99px; font-size: 13.5px; font-weight: 600; color: var(--mute); background: var(--surf); border: 1px solid var(--line); transition: color .15s, background .15s, border-color .15s; white-space: nowrap; }
  .chip:hover { color: var(--text); border-color: var(--line-2); }
  .chip.is-on { color: #fff; background: var(--grad); border-color: transparent; box-shadow: 0 8px 18px -8px rgba(124,108,255,.8); }
  .chip small { opacity: .7; font-weight: 500; margin-left: 5px; font-size: 12px; }

  .empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; padding: 64px 32px; color: var(--mute); }
  .empty__ico { width: 76px; height: 76px; border-radius: 50%; display: grid; place-items: center; font-size: 32px; color: #cdbcff; background: radial-gradient(circle at 30% 30%, rgba(168,119,255,.35), rgba(79,157,255,.08)); border: 1px solid var(--line-2); margin-bottom: 6px; }
  .empty h3 { font-family: var(--display); font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: -.02em; }
  .empty p { max-width: 30ch; font-size: 14px; }

  /* ---------- search ---------- */
  .search { padding: 8px var(--pad) 0; }
  .search__box { position: relative; }
  .search__box > i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); font-size: 20px; color: var(--dim); pointer-events: none; }
  .search__input { width: 100%; height: 54px; border-radius: 18px; padding: 0 48px 0 48px; font-size: 16px; background: var(--surf); border: 1.5px solid var(--line); outline: none; transition: border-color .2s, box-shadow .2s; }
  .search__input::placeholder { color: var(--dim); }
  .search__input:focus { border-color: var(--vio); box-shadow: 0 0 0 4px rgba(155,109,255,.18); }
  .search__clear { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); width: 30px; height: 30px; border-radius: 50%; background: rgba(255,255,255,.1); display: grid; place-items: center; font-size: 16px; }
  .search__seg { display: flex; gap: 8px; overflow-x: auto; margin: 14px calc(var(--pad) * -1) 18px; padding: 0 var(--pad); }
  .search__h { display: flex; justify-content: space-between; align-items: baseline; margin: 22px 0 12px; }
  .search__h h2 { font-family: var(--display); font-size: 18px; font-weight: 700; letter-spacing: -.02em; }
  .search__h button { color: var(--mute); font-size: 13px; font-weight: 600; }
  .recent { display: flex; flex-wrap: wrap; gap: 8px; }
  .recent button { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: 99px; background: var(--surf); border: 1px solid var(--line); font-size: 13.5px; color: var(--mute); }
  .recent button i { font-size: 15px; color: var(--dim); }
  .hint { font-size: 12.5px; color: var(--dim); margin-bottom: 14px; }

  /* ---------- detail ---------- */
  .detail { position: fixed; inset: 0; z-index: 40; background: var(--bg); overflow-y: auto; animation: page-in .34s cubic-bezier(.2,.8,.2,1) both; }
  .detail__hero { position: relative; height: min(52vh, 440px); min-height: 330px; overflow: hidden; }
  .detail__bg { position: absolute; inset: 0; background-size: cover; background-position: center 18%; }
  .detail__bg--blur { inset: -24px; filter: blur(22px) saturate(1.3); transform: scale(1.1); }
  .detail__shade { position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(9,7,22,.6) 0%, rgba(9,7,22,.05) 34%, rgba(9,7,22,.7) 72%, var(--bg) 100%); }
  .detail__top { position: fixed; z-index: 3; top: calc(var(--sat) + 10px); left: var(--pad); right: var(--pad); display: flex; justify-content: space-between; pointer-events: none; }
  .detail__top > * { pointer-events: auto; }
  .detail__id { position: absolute; left: var(--pad); right: var(--pad); bottom: 6px; display: flex; align-items: flex-end; gap: 16px; }
  .detail__poster { position: relative; width: 104px; flex: none; aspect-ratio: 2/3; border-radius: 14px; overflow: hidden; background: var(--surf); box-shadow: 0 22px 40px -14px rgba(0,0,0,.9), 0 0 0 1px rgba(255,255,255,.12); }
  .detail__title { font-family: var(--display); font-weight: 800; font-size: clamp(24px, 6.4vw, 40px); line-height: 1.04; letter-spacing: -.035em; text-wrap: balance; }
  .detail__meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .detail__body { padding: 18px var(--pad) calc(40px + var(--sab)); max-width: 900px; }
  .detail__plot { color: var(--mute); font-size: 14.5px; line-height: 1.55; margin-bottom: 4px; }
  .detail__more { color: #cdbcff; font-weight: 600; font-size: 13.5px; margin-bottom: 18px; }
  .detail__facts { color: var(--dim); font-size: 13px; margin: 12px 0 0; }
  .detail__facts b { color: var(--mute); font-weight: 600; }
  @media (min-width: 860px) { .detail__poster { width: 150px; } .detail__body { padding-top: 26px; } }

  .resume { width: 100%; display: flex; align-items: center; gap: 14px; padding: 14px; margin: 18px 0 6px; border-radius: 20px; background: linear-gradient(135deg, rgba(168,119,255,.22), rgba(79,157,255,.14)); border: 1px solid rgba(168,139,255,.35); transition: transform .15s; }
  .resume:active { transform: scale(.985); }
  .resume__play { width: 50px; height: 50px; flex: none; border-radius: 50%; display: grid; place-items: center; font-size: 24px; background: var(--grad); box-shadow: 0 10px 24px -6px rgba(124,108,255,.85); }
  .resume__txt { flex: 1; min-width: 0; }
  .resume__k { font-size: 12.5px; color: #cdbcff; font-weight: 600; }
  .resume__t { font-weight: 700; font-size: 15px; margin: 1px 0 8px; }
  .resume__foot { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--dim); margin-top: 5px; }

  .seasons { display: flex; gap: 8px; overflow-x: auto; margin: 22px calc(var(--pad) * -1) 14px; padding: 2px var(--pad); }
  .eps { display: flex; flex-direction: column; gap: 10px; }
  .ep { position: relative; display: flex; align-items: center; border-radius: 18px; background: var(--surf); border: 1px solid var(--line); scroll-margin: 120px 0; transition: background .15s; }
  .ep:hover { background: var(--surf-2); }
  .ep.is-here { background: linear-gradient(135deg, rgba(168,119,255,.18), rgba(79,157,255,.1)); border-color: transparent; animation: here 1.6s ease-out 3; box-shadow: 0 0 0 1px var(--vio); }
  .ep__main { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; padding: 10px 0 10px 10px; }
  .ep__thumb { position: relative; width: 116px; flex: none; aspect-ratio: 16/9; border-radius: 12px; overflow: hidden; background: var(--surf-3); }
  .ep__thumb .ph { font-size: 20px; }
  .ep__thumb .track { position: absolute; left: 0; right: 0; bottom: 0; border-radius: 0; height: 3px; }
  .ep__playing { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(9,7,22,.35); font-size: 22px; }
  .ep__n { font-size: 12px; font-weight: 700; color: #cdbcff; display: flex; gap: 8px; align-items: center; }
  .ep__n span { color: var(--dim); font-weight: 500; }
  .ep__here { display: inline-flex; height: 18px; align-items: center; padding: 0 7px; border-radius: 99px; background: var(--grad); color: #fff !important; font-size: 10.5px; font-weight: 700 !important; }
  .ep__t { font-size: 14.5px; font-weight: 600; line-height: 1.25; margin-top: 2px; }
  .ep.is-watched .ep__t { color: var(--dim); }
  .ep.is-watched .ep__thumb .art { filter: saturate(.4) brightness(.6); }
  .ep__check { width: 46px; height: 46px; flex: none; display: grid; place-items: center; font-size: 22px; color: var(--dim); margin-right: 4px; border-radius: 50%; }
  .ep__check.is-on { color: var(--ok); }
  @media (min-width: 860px) { .ep__thumb { width: 160px; } }

  /* ---------- sheet ---------- */
  .scrim { position: fixed; inset: 0; z-index: 60; background: rgba(4,3,12,.66); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); animation: fade .2s both; display: flex; align-items: flex-end; justify-content: center; }
  .scrim.is-out { opacity: 0; transition: opacity .2s; }
  .sheet { width: 100%; max-width: 480px; max-height: 88vh; overflow-y: auto; background: var(--bg-2); border: 1px solid var(--line-2); border-bottom: 0; border-radius: var(--r-l) var(--r-l) 0 0; padding: 10px 20px calc(22px + var(--sab)); animation: sheet-in .3s cubic-bezier(.2,.85,.25,1) both; box-shadow: 0 -20px 60px rgba(0,0,0,.6); }
  .is-out .sheet { animation: sheet-out .2s ease-in both; }
  .sheet__grab { width: 40px; height: 4px; border-radius: 4px; background: rgba(255,255,255,.2); margin: 0 auto 16px; }
  .sheet__head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .sheet__title { font-family: var(--display); font-weight: 700; font-size: 22px; letter-spacing: -.03em; }
  @media (min-width: 860px) { .scrim { align-items: center; } .sheet { border-radius: var(--r-l); border-bottom: 1px solid var(--line-2); } .sheet__grab { display: none; } }

  .act { width: 100%; display: flex; align-items: center; gap: 14px; height: 54px; padding: 0 14px; border-radius: 14px; font-weight: 600; font-size: 15px; transition: background .15s; }
  .act:hover { background: rgba(255,255,255,.07); }
  .act i { font-size: 21px; color: #cdbcff; }
  .act--danger, .act--danger i { color: var(--danger); }
  .sheet__item { display: flex; gap: 14px; align-items: center; margin-bottom: 14px; padding-bottom: 16px; border-bottom: 1px solid var(--line); }
  .sheet__thumb { position: relative; width: 52px; aspect-ratio: 2/3; border-radius: 10px; overflow: hidden; flex: none; background: var(--surf); }

  .card { background: var(--surf); border: 1px solid var(--line); border-radius: 18px; padding: 16px; }
  .set-sec { margin-bottom: 18px; }
  .set-sec h3 { font-size: 13px; font-weight: 600; color: var(--dim); margin: 0 0 8px 4px; }
  .acct { display: flex; align-items: center; gap: 14px; }
  .acct__av { width: 48px; height: 48px; border-radius: 16px; flex: none; display: grid; place-items: center; background: var(--grad); font-family: var(--display); font-weight: 800; font-size: 20px; }
  .acct__n { font-weight: 700; font-size: 15.5px; }
  .acct__s { font-size: 12.5px; color: var(--mute); }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .stat { background: var(--surf); border: 1px solid var(--line); border-radius: 16px; padding: 12px 10px; text-align: center; }
  .stat b { display: block; font-family: var(--display); font-size: 22px; font-weight: 800; letter-spacing: -.03em; }
  .stat span { font-size: 12px; color: var(--mute); }
  .confirm { background: rgba(255,107,142,.1); border: 1px solid rgba(255,107,142,.3); border-radius: 16px; padding: 14px; }
  .confirm p { font-size: 13.5px; color: #ffc2d0; margin-bottom: 12px; }
  .confirm div { display: flex; gap: 8px; }
  .build { text-align: center; font-size: 11.5px; color: var(--dim); margin-top: 6px; }


  /* ---------- ao vivo ---------- */
  .chips--flow { position: static; background: none; }
  .live { padding: 0 var(--pad); }
  .live__hint { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--mute); margin: 0 0 14px; }
  .live__hint i { font-size: 17px; color: #cdbcff; flex: none; }
  .live__sec { margin-bottom: 26px; }
  .live__head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
  .chlist { display: flex; flex-direction: column; gap: 8px; }
  .ch { display: flex; align-items: center; border-radius: 18px; background: var(--surf); border: 1px solid var(--line); transition: background .15s, border-color .15s; }
  .ch:hover { background: var(--surf-2); }
  .ch.is-on { background: linear-gradient(135deg, rgba(168,119,255,.22), rgba(79,157,255,.12)); border-color: rgba(168,139,255,.6); }
  .ch__main { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; padding: 10px 0 10px 10px; }
  .ch__logo { position: relative; width: 54px; height: 54px; flex: none; border-radius: 14px; overflow: hidden; background: var(--surf-3); }
  .ch__logo .art { object-fit: contain; padding: 7px; }
  .ch__logo .ph { font-size: 20px; background: none; }
  .ch__name { font-weight: 600; font-size: 15px; line-height: 1.25; overflow-wrap: anywhere; }
  .ch__meta { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 8px; margin-top: 4px; font-size: 12.5px; color: var(--mute); min-width: 0; }
  .ch__meta:empty { display: none; }
  .ch__time { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 7px; border-radius: 6px; font-weight: 700; font-size: 11.5px; color: #fff; background: rgba(168,119,255,.28); font-variant-numeric: tabular-nums; }
  .ch__time i { font-size: 12px; }
  .ch__q { height: 20px; padding: 0 6px; border-radius: 6px; font-size: 10.5px; font-weight: 700; display: inline-flex; align-items: center; border: 1px solid var(--line-2); color: var(--mute); }
  .ch__onair { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: 11.5px; color: #cdbcff; }
  .ch__prog { min-width: 0; flex: 1 1 100%; }
  .ch__bar { height: 3px; margin-top: 7px; max-width: 220px; }
  .ch__go { width: 46px; height: 46px; flex: none; margin: 0 6px 0 2px; border-radius: 50%; display: grid; place-items: center; font-size: 21px; color: var(--mute); transition: background .15s, color .15s, transform .15s; }
  .ch__go:hover { background: rgba(255,255,255,.08); color: #fff; }
  .ch__go:active { transform: scale(.9); }
  .ch.is-on .ch__go { background: var(--grad); color: #fff; box-shadow: 0 8px 18px -6px rgba(124,108,255,.8); }
  .eq { display: inline-flex; align-items: flex-end; gap: 2px; height: 11px; }
  .eq i { width: 2.5px; height: 100%; border-radius: 2px; background: currentColor; transform-origin: bottom; animation: eq .9s ease-in-out infinite; }
  .eq i:nth-child(2) { animation-delay: .25s; } .eq i:nth-child(3) { animation-delay: .5s; }

  .pv { position: sticky; top: calc(var(--sat) + var(--hh)); z-index: 15; margin: 0 calc(var(--pad) * -1) 6px; padding: 8px var(--pad) 10px; background: var(--bg); }
  @media (max-height: 560px) { .pv { position: static; } }
  .pv__frame { position: relative; aspect-ratio: 16/9; border-radius: 20px; overflow: hidden; background: #000; box-shadow: 0 0 0 1px var(--line-2), 0 24px 44px -20px rgba(0,0,0,.95), 0 0 70px -24px rgba(124,108,255,.7); }
  .pv__frame video { width: 100%; height: 100%; object-fit: contain; display: block; background: #000; }
  .pv__hit { position: absolute; inset: 0; width: 100%; }
  .pv__shade { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(to top, rgba(4,3,12,.94) 0%, rgba(4,3,12,.1) 52%, rgba(4,3,12,.5) 100%); }
  .pv__top { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; align-items: center; justify-content: space-between; pointer-events: none; }
  .pv__top > * { pointer-events: auto; }
  .pv__top .iconbtn { width: 36px; height: 36px; font-size: 17px; }
  .pv__live { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px; border-radius: 7px; font-size: 11px; font-weight: 800; letter-spacing: .04em; background: rgba(255,59,92,.92); color: #fff; }
  .pv__live i { width: 6px; height: 6px; border-radius: 50%; background: #fff; animation: pulse 1.4s ease-in-out infinite; }
  .pv__info { position: absolute; left: 12px; right: 12px; bottom: 12px; display: flex; align-items: flex-end; gap: 10px; pointer-events: none; }
  .pv__info > * { pointer-events: auto; }
  .pv__txt { flex: 1; min-width: 0; pointer-events: none; }
  .pv__name { font-family: var(--display); font-weight: 700; font-size: 17px; line-height: 1.15; letter-spacing: -.02em; text-shadow: 0 1px 8px rgba(0,0,0,.8); }
  .pv__now { font-size: 12.5px; color: var(--mute); margin-top: 2px; }
  .pv__err { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: var(--mute); font-size: 13px; background: radial-gradient(circle at 50% 40%, rgba(155,109,255,.18), #05040d 70%); pointer-events: none; }
  .pv__err i { font-size: 28px; color: var(--dim); }
  @media (min-width: 860px) {
    .live.has-pv { display: grid; grid-template-columns: minmax(0, 1fr) min(44%, 560px); gap: 28px; align-items: start; }
    .live.has-pv .pv { order: 2; margin: 0; padding: 0; background: none; top: calc(var(--sat) + var(--hh) + 16px); }
  }
  @media (min-width: 1280px) { .live:not(.has-pv) .chlist { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); } }

  /* ---------- em alta ---------- */
  i.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; box-shadow: 0 0 0 2px rgba(255,255,255,.14); }
  .trend { padding: 0 var(--pad); }
  .trend__sum { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 20px; margin-bottom: 20px; background: linear-gradient(135deg, rgba(168,119,255,.2), rgba(79,157,255,.1)); border: 1px solid rgba(168,139,255,.3); }
  .trend__big { font-family: var(--display); font-weight: 800; font-size: 34px; letter-spacing: -.04em; line-height: 1; flex: none; }
  .trend__big small { font-size: 17px; color: var(--mute); font-weight: 700; }
  .trend__sum p { font-size: 13px; color: var(--mute); line-height: 1.35; }
  .trend__sum b { display: block; color: var(--text); font-size: 14.5px; font-weight: 700; }
  .trend__cols { display: grid; gap: 28px; }
  @media (min-width: 860px) { .trend__cols { grid-template-columns: 1fr 1fr; gap: 32px; } }
  .trend__h { font-family: var(--display); font-weight: 700; font-size: 19px; letter-spacing: -.02em; margin-bottom: 10px; }
  .ranks { display: flex; flex-direction: column; gap: 8px; }
  .rank { width: 100%; display: flex; align-items: center; gap: 12px; padding: 8px 10px 8px 2px; border-radius: 18px; background: var(--surf); border: 1px solid var(--line); transition: background .15s, transform .15s; }
  button.rank:hover { background: var(--surf-2); }
  button.rank:active { transform: scale(.985); }
  .rank__n { width: 46px; flex: none; text-align: center; font-family: var(--display); font-weight: 800; font-size: 38px; letter-spacing: -.07em; line-height: 1; color: transparent; -webkit-text-stroke: 1.5px rgba(168,139,255,.8); font-variant-numeric: tabular-nums; }
  .rank__art { position: relative; width: 54px; flex: none; aspect-ratio: 2/3; border-radius: 10px; overflow: hidden; background: var(--surf-3); }
  .rank__art .ph { font-size: 18px; }
  .rank__txt { flex: 1; min-width: 0; }
  .rank__t { font-weight: 600; font-size: 15px; line-height: 1.25; }
  .rank__s { font-size: 12.5px; color: var(--mute); margin-top: 3px; display: flex; flex-wrap: wrap; gap: 2px 8px; align-items: center; }
  .rank__s i { color: #ffd166; font-size: 12px; margin-right: 2px; }
  .rank__ok { color: var(--ok); font-weight: 700; }
  .rank__no { color: var(--dim); }
  .rank__go { width: 40px; height: 40px; flex: none; border-radius: 50%; display: grid; place-items: center; font-size: 20px; background: var(--grad); box-shadow: 0 8px 18px -6px rgba(124,108,255,.8); }
  .rank.is-off { background: transparent; border-style: dashed; }
  .rank.is-off .rank__art, .rank.is-off .rank__t { opacity: .5; }
  .rank.is-off .rank__n { -webkit-text-stroke-color: rgba(190,180,255,.3); }
  .trend__note { font-size: 11.5px; color: var(--dim); margin: 26px 0 0; line-height: 1.5; }
  .seg { display: flex; padding: 4px; margin-bottom: 16px; border-radius: 14px; background: var(--surf); border: 1px solid var(--line); }
  .seg button { flex: 1; height: 38px; border-radius: 10px; text-align: center; font-size: 13.5px; font-weight: 600; color: var(--mute); transition: background .15s, color .15s; }
  .seg button.is-on { background: var(--surf-3); color: #fff; box-shadow: 0 0 0 1px var(--line-2); }

  /* ---------- ajustes ---------- */
  .kv { display: flex; justify-content: space-between; align-items: center; gap: 14px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; }
  .kv:last-child { border-bottom: 0; padding-bottom: 0; }
  .kv > span:first-child { color: var(--mute); flex: none; }
  .kv b { font-weight: 600; text-align: right; min-width: 0; overflow-wrap: anywhere; }
  .kv button { color: #cdbcff; font-size: 17px; margin-left: 8px; vertical-align: -3px; }
  .acct__edit { margin-left: auto; flex: none; }
  .setform { display: flex; flex-direction: column; gap: 10px; }
  .setform__btns { display: flex; gap: 8px; margin-top: 4px; }
  .opt { width: 100%; display: flex; align-items: center; gap: 14px; text-align: left; }
  .opt__t { font-weight: 600; font-size: 15px; }
  .opt__s { font-size: 12.5px; color: var(--mute); margin-top: 1px; }
  .switch { position: relative; width: 46px; height: 28px; flex: none; border-radius: 99px; background: rgba(255,255,255,.16); transition: background .2s; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform .2s; }
  .switch.is-on { background: var(--grad); }
  .switch.is-on::after { transform: translateX(18px); }

  /* ---------- player ---------- */
  .player { position: fixed; inset: 0; z-index: 80; background: #000; display: flex; flex-direction: column; padding-top: var(--sat); padding-bottom: var(--sab); animation: fade .25s both; }

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useCallback, useMemo, createContext, useContext } = React;

const APP_NAME = 'Nyx';
const BUILD = '2026-11-15.6';
const WATCHED_AT = 0.92; // a partir de 92% o item conta como assistido

/* ============================== IndexedDB ============================== */
// Mesmo banco do app antigo, para manter login, progresso e favoritos.
const DB_NAME = 'playplus_db';
const STORE = 'kv';
let dbPromise = null;
function openDB() {
  if (!dbPromise) {
    dbPromise = new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = () => { req.result.createObjectStore(STORE); };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => { dbPromise = null; reject(req.error); };
    });
  }
  return dbPromise;
}
async function idbSet(key, value) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).put(value, key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function idbGet(key) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readonly');
    const req = tx.objectStore(STORE).get(key);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

/* ============================== Helpers ============================== */
function fmtClock(sec) {
  sec = Math.max(0, Math.floor(sec || 0));
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  const mm = h ? String(m).padStart(2, '0') : String(m);
  return (h ? h + ':' : '') + mm + ':' + String(s).padStart(2, '0');
}
function fmtLeft(sec) {
  const min = Math.max(1, Math.round((sec || 0) / 60));
  if (min < 60) return `faltam ${min} min`;
  return `faltam ${Math.floor(min / 60)} h ${String(min % 60).padStart(2, '0')}`;
}
function pctOf(p) {
  if (!p) return 0;
  if (p.watched) return 100;
  if (!p.duration || p.duration <= 0) return 0;
  return Math.max(0, Math.min(100, Math.round((p.time / p.duration) * 100)));
}
function epLabel(p) {
  if (p.season != null && p.episodeNum != null) return `T${p.season} E${p.episodeNum}`;
  if (p.episodeNum != null) return `Ep. ${p.episodeNum}`;
  return p.extraTitle || '';
}
function cleanEpTitle(title, seriesName, num) {
  let t = String(title || '').trim();
  const m = t.match(/S\d{1,2}\s*E\d{1,3}\s*[-–—:.]?\s*(.*)$/i);
  if (m) t = m[1].trim();
  else if (seriesName && t.toLowerCase().startsWith(String(seriesName).toLowerCase())) t = t.slice(seriesName.length).replace(/^[\s\-–—:]+/, '');
  return t || `Episódio ${num}`;
}
function epMinutes(ep) {
  const inf = ep && ep.info;
  if (!inf) return null;
  let secs = Number(inf.duration_secs) || 0;
  if (!secs && typeof inf.duration === 'string') {
    const parts = inf.duration.split(':').map(Number);
    if (parts.length === 3 && parts.every((n) => !isNaN(n))) secs = parts[0] * 3600 + parts[1] * 60 + parts[2];
  }
  return secs > 60 ? Math.round(secs / 60) : null;
}
function ratingOf(item) {
  const r5 = parseFloat(item.rating_5based);
  if (r5 > 0) return (r5 * 2).toFixed(1);
  const r = parseFloat(item.rating);
  if (r > 0) return (r > 10 ? r / 10 : r).toFixed(1);
  return null;
}
function nextRef(ep, seasonKey) {
  if (!ep) return null;
  return { id: ep.id, episode_num: ep.episode_num, season: seasonKey, title: ep.title || '', container_extension: ep.container_extension };
}
// Lista plana, na ordem certa, de todos os episódios com a temporada de cada um.
function flattenEpisodes(info) {
  if (!info || !info.episodes) return [];
  const keys = Object.keys(info.episodes).sort((a, b) => Number(a) - Number(b));
  const out = [];
  for (const k of keys) {
    const list = Array.isArray(info.episodes[k]) ? info.episodes[k] : [];
    for (const ep of list) out.push({ ep, season: k });
  }
  return out;
}


/* ============================== Ao vivo: nome do canal + guia ============================== */
function b64(s) {
  try {
    const bin = atob(String(s || ''));
    return new TextDecoder('utf-8').decode(Uint8Array.from(bin, (c) => c.charCodeAt(0))).trim();
  } catch (e) { return ''; }
}
function hhmm(ms) { return new Date(ms).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }); }
// "11:00 Chipre x Montenegro - Disney+" vira { time: '11:00', title: 'Chipre x Montenegro - Disney+' }
function parseChannel(name) {
  let title = String(name || '').trim(), time = null, q = null;
  const mt = title.match(/^(\d{1,2})[:h](\d{2})\s*[-–|]?\s*(\S.*)$/i);
  if (mt) { time = mt[1].padStart(2, '0') + ':' + mt[2]; title = mt[3]; }
  const mq = title.match(/^(.*?)[\s\-|]+(4K|UHD|FHD|HD|SD)\W*$/i);
  if (mq && mq[1].trim()) { q = mq[2].toUpperCase(); title = mq[1].trim(); }
  return { time, title, q };
}

const epgCache = new Map();
const epgQueue = [];
let epgActive = 0;
function epgPump() {
  while (epgActive < 4 && epgQueue.length) {
    const job = epgQueue.shift();
    epgActive++;
    job().finally(() => { epgActive--; epgPump(); });
  }
}
function loadEpg(session, id) {
  const hit = epgCache.get(id);
  if (hit && Date.now() - hit.at < 5 * 60000) return hit.promise;
  const promise = new Promise((resolve) => {
    epgQueue.push(async () => {
      try {
        const url = `${session.server}/player_api.php?username=${encodeURIComponent(session.user)}&password=${encodeURIComponent(session.pass)}&action=get_short_epg&stream_id=${encodeURIComponent(String(id))}&limit=3`;
        const res = await fetch(url, { signal: AbortSignal.timeout(10000) });
        const json = await res.json();
        const list = (json && Array.isArray(json.epg_listings) ? json.epg_listings : [])
          .map((e) => ({ title: b64(e.title), start: Number(e.start_timestamp) * 1000, stop: Number(e.stop_timestamp) * 1000 }))
          .filter((e) => e.title);
        resolve(list);
      } catch (e) { resolve([]); }
    });
    epgPump();
  });
  epgCache.set(id, { at: Date.now(), promise });
  return promise;
}
function useEpg(session, item, enabled) {
  const [now, setNow] = useState(null);
  const id = item ? item.stream_id : null;
  useEffect(() => {
    setNow(null);
    if (!enabled || id == null) return;
    let alive = true;
    loadEpg(session, id).then((list) => {
      if (!alive) return;
      const t = Date.now();
      setNow(list.find((e) => e.start <= t && t < e.stop) || null);
    });
    return () => { alive = false; };
  }, [enabled, id]);
  return now;
}
function useSeen() {
  const ref = useRef(null);
  const [seen, setSeen] = useState(false);
  useEffect(() => {
    const el = ref.current;
    if (!el || seen) return;
    if (!('IntersectionObserver' in window)) { setSeen(true); return; }
    const io = new IntersectionObserver((es) => { if (es.some((e) => e.isIntersecting)) { setSeen(true); io.disconnect(); } }, { rootMargin: '200px' });
    io.observe(el);
    return () => io.disconnect();
  }, [seen]);
  return [ref, seen];
}

/* ============================== Preferências ============================== */
const DEFAULT_PREFS = { livePreview: true };
function usePrefs() {
  const [prefs, setPrefs] = useState(DEFAULT_PREFS);
  useEffect(() => { idbGet('prefs').then((p) => { if (p) setPrefs({ ...DEFAULT_PREFS, ...p }); }).catch(() => {}); }, []);

    setPrefs((prev) => { const next = { ...prev, ...patch }; idbSet('prefs', next).catch(() => {}); return next; });
  }, []);
  return [prefs, set];
}

function chartsStamp(c) {
  let max = '';
  for (const group of [c && c.official, c && c.daily]) {
    for (const v of Object.values(group || {})) if (v && String(v.updated || '') > max) max = String(v.updated);
  }
  return max;
}
function validCharts(c) { return !!(c && c.daily && typeof c.daily === 'object' && Object.keys(c.daily).length > 0); }

// Marcas de versão que os servidores penduram no nome e que não fazem parte do título.
const TAG_WORDS = new Set(['4k', 'uhd', 'fhd', 'hd', 'sd', 'dublado', 'legendado', 'dub', 'leg', 'dual', 'hevc', 'h265']);
const STOP_WORDS = new Set(['a', 'o', 'as', 'os', 'de', 'da', 'do', 'das', 'dos', 'e', 'em', 'no', 'na', 'um', 'uma', 'the', 'of', 'and', 'an']);
function normTitle(s) {
  return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/\[[^\]]*\]|\([^)]*\)/g, ' ').replace(/&/g, ' e ').replace(/[^a-z0-9]+/g, ' ').trim()
    .split(' ').filter((w) => w && !TAG_WORDS.has(w)).join(' ');
}
const sigTokens = (norm) => norm.split(' ').filter((w) => w && !STOP_WORDS.has(w));
// Chave que identifica o mesmo título em entradas diferentes da playlist
// ("Padrões de Morte (2026)" e "Padrões de Morte (2026) Leg" têm a mesma chave).
function titleKey(it) {
  const raw = it.name || it.title || '';

  const tail = inPar ? null : full.match(/^(.+)\s((?:19|20)\d{2})$/);
  const year = inPar ? inPar[1] : (tail ? tail[2] : (/^(19|20)\d{2}$/.test(String(it.year || '')) ? String(it.year) : ''));
  return { base: (tail ? tail[1] : full) || raw.toLowerCase(), year };
}
const isLeg = (it) => /(^|[^a-z])leg(endado)?([^a-z]|$)|\[l\]/i.test(it.name || '');
const is4k = (it) => /(^|[^a-z0-9])(4k|uhd)([^a-z0-9]|$)/i.test(it.name || '');
function variantLabel(it) {
  const m = (it.name || '').match(/(^|[^a-z0-9])(4k|uhd|fhd|hd|sd)([^a-z0-9]|$)/i);
  const q = m ? ({ uhd: '4K' }[m[2].toLowerCase()] || m[2].toUpperCase()) : '';
  return (isLeg(it) ? 'Legendado' : 'Dublado') + (q ? ' ' + q : '');
}
// Junta as entradas repetidas: sobra um representante por título (de preferência o dublado comum)
// e as outras versões ficam em .variants, para escolher dentro dos detalhes.
function groupTitles(items) {
  // Primeiro por nome; dentro do nome, por ano. Entrada sem ano se junta ao único ano conhecido
  // ("Cantar! [4K]" + "Cantar! (2016)"), mas anos diferentes continuam separados (refilmagens).
  const byBase = new Map();
  for (const it of items) {
    const k = titleKey(it);
    it._y = k.year;
    const arr = byBase.get(k.base);
    if (arr) arr.push(it); else byBase.set(k.base, [it]);
    it._k = k.base;
  }
  const groups = new Map();
  for (const [base, arr] of byBase) {
    const years = new Set(arr.map((x) => x._y).filter(Boolean));
    const only = years.size === 1 ? [...years][0] : '';
    for (const it of arr) {
      it._k = base + '|' + (it._y || only);
      const g = groups.get(it._k);
      if (g) g.push(it); else groups.set(it._k, [it]);
    }
  }
  const reps = [], repOf = new Map();
  const score = (x) => (isLeg(x) ? 2 : 0) + (is4k(x) ? 1 : 0);
  for (const g of groups.values()) {
    let r = g[0];
    if (g.length > 1) { r = g.reduce((a, b) => (score(b) < score(a) ? b : a)); for (const x of g) x.variants = g; }
    reps.push(r); repOf.set(r._k, r);
  }
  return { reps, repOf };
}
function groupByCatUniq(items, repOf) {
  const map = new Map(), seen = new Map();
  for (const it of items) {
    const k = String(it.category_id);
    let arr = map.get(k), had = seen.get(k);
    if (!arr) { arr = []; map.set(k, arr); had = new Set(); seen.set(k, had); }
    const r = repOf.get(it._k) || it;
    if (had.has(r)) continue;
    had.add(r); arr.push(r);
  }
  return map;
}
// Rankings: a mesma série pode aparecer várias vezes (uma por temporada). Fica uma linha só.
function uniqEntries(arr) {
  const seen = new Map(), out = [];
  for (const e of arr || []) {
    const k = e.tmdbId ? 't' + e.tmdbId : 'n' + normTitle(e.title);
    const prev = seen.get(k);
    if (prev) { prev.parts = (prev.parts || 1) + 1; prev.weeks = Math.max(prev.weeks || 0, e.weeks || 0); continue; }
    const c = { ...e };
    seen.set(k, c); out.push(c);
  }
  return out.map((e, i) => ({ ...e, rank: i + 1, season: e.parts > 1 ? '' : e.season }));
}

function buildTitleIndex(items) {
  const byName = new Map(), byTmdb = new Map(), byToken = new Map();
  const put = (k, rec) => { if (!k) return; const arr = byName.get(k); if (arr) arr.push(rec); else byName.set(k, [rec]); };
  for (const it of items) {
    const raw = it.name || it.title || '';
    const tid = it.tmdb || it.tmdb_id;
    if (tid && String(tid) !== '0') byTmdb.set(String(tid), it);
    const full = normTitle(raw);
    const inPar = raw.match(/[(\[]\s*((?:19|20)\d{2})\s*[)\]]/);
    const tail = full.match(/^(.+)\s((?:19|20)\d{2})$/);
    const year = Number(inPar ? inPar[1] : (it.year || (tail ? tail[2] : 0))) || 0;
    const rec = { item: it, year, tokens: new Set(sigTokens(tail && !inPar ? tail[1] : full)) };
    put(full, rec);
    if (tail) put(tail[1], rec); // "Titulo 2010" também responde por "titulo"
    for (const t of rec.tokens) { const arr = byToken.get(t); if (arr) arr.push(rec); else byToken.set(t, [rec]); }
  }

const subset = (a, b) => { if (a.size === 0) return false; for (const x of a) if (!b.has(x)) return false; return true; };
// Procura um título dos rankings na playlist. Três tentativas, da mais segura para a mais solta:
//  1) id do TMDB; 2) nome igual; 3) nome parecido, como a busca faria: as palavras do nome da
//     playlist estão no título/título original do ranking (ou o contrário) e o ano confere.
//     Ex.: "From - A Origem do Mal" (From, 2022) casa com "Origem (2022) From".
function findInPlaylist(index, entry) {
  if (entry.tmdbId != null) { const hit = index.byTmdb.get(String(entry.tmdbId)); if (hit) return hit; }
  const y = Number(entry.year) || 0;
  const tried = new Set();
  for (const name of [entry.title, entry.original, ...(entry.alt || [])]) {
    const k = normTitle(name);
    if (!k || tried.has(k)) continue;
    tried.add(k);
    const hits = index.byName.get(k);
    if (!hits) continue;
    if (!y || entry.kind === 'series') return hits[0].item;
    const exact = hits.find((h) => h.year && Math.abs(h.year - y) <= 1);
    if (exact) return exact.item;
    const noYear = hits.find((h) => !h.year);
    if (noYear) return noYear.item;
  }

  const T = new Set(sigTokens(normTitle(entry.title)));
  const O = new Set(sigTokens(normTitle(entry.original)));
  const U = new Set([...T, ...O]);
  for (const a of entry.alt || []) for (const t of sigTokens(normTitle(a))) U.add(t);
  let best = null, bestScore = -1;
  const seen = new Set();
  for (const tok of U) {
    const recs = index.byToken.get(tok);
    if (!recs || recs.length > 4000) continue;
    for (const rec of recs) {
      if (seen.has(rec)) continue;
      seen.add(rec);
      const A = subset(rec.tokens, U);                       // tudo que está no nome da playlist está no ranking
      const viaT = subset(T, rec.tokens), viaO = subset(O, rec.tokens);
      const B = viaT || viaO;                                // o título do ranking está inteiro no nome da playlist
      if (!A && !B) continue;
      const yearOk = !!(y && rec.year && Math.abs(rec.year - y) <= 1);
      const yearBad = !!(y && rec.year && !yearOk);
      let ok = false;
      if (A && B) ok = !yearBad || entry.kind === 'series';
      else if (yearOk) {
        // Só uma direção bate: exige ano igual e não aceita casar por uma palavra solta.
        const small = A ? rec.tokens.size : (viaT ? T.size : O.size);
        ok = small >= 2 || rec.tokens.size <= 2;
      }
      if (!ok) continue;
      const score = (yearOk ? 100 : 0) + (A && B ? 50 : 0) - Math.abs(rec.tokens.size - T.size);
      if (score > bestScore) { bestScore = score; best = rec; }
    }
  }
  return best ? best.item : null;
}

function useCharts(data) {
  const [charts, setCharts] = useState(CHARTS_SNAPSHOT);
  const [status, setStatus] = useState('loading'); // loading | live | stale
  const newer = (next) => setCharts((cur) => (chartsStamp(next) >= chartsStamp(cur) ? next : cur));

  const refresh = useCallback(async () => {
    setStatus('loading');
    try {
      // O parâmetro muda a cada 10 min só para furar o cache do navegador.
      const res = await fetch(`${CHARTS_URL}?t=${Math.floor(Date.now() / 600000)}`, { signal: AbortSignal.timeout(12000) });
      if (!res.ok) throw new Error('http_error');
      const j = await res.json();
      if (!validCharts(j)) throw new Error('bad_data');
      newer(j);
      idbSet('charts', j).catch(() => {});
      setStatus('live');
    } catch (e) { setStatus('stale'); }
  }, []);

  useEffect(() => {
    idbGet('charts').then((c) => { if (validCharts(c)) newer(c); }).catch(() => {});
    refresh();
    // Voltou para o app depois de um tempo? Busca o ranking de novo.
    let last = Date.now();
    const onShow = () => { if (!document.hidden && Date.now() - last > 30 * 60000) { last = Date.now(); refresh(); } };
    document.addEventListener('visibilitychange', onShow);
    return () => document.removeEventListener('visibilitychange', onShow);
  }, [refresh]);

  const index = useMemo(() => (data ? { movie: buildTitleIndex(data.movies), series: buildTitleIndex(data.series) } : null), [data]);
  const match = useCallback((entry) => (index ? findInPlaylist(index[entry.kind], entry) : null), [index]);

  return { charts, status, refresh, match };
}

/* ============================== Auth ============================== */
const AuthContext = createContext(null);

function normalizeServer(raw) {
  let s = raw.trim();
  if (!/^https?:\/\//i.test(s)) s = 'http://' + s;
  return s.replace(/\/+$/, '');
}

async function fetchAccount(server, user, pass, timeout) {
  const url = `${server}/player_api.php?username=${encodeURIComponent(user)}&password=${encodeURIComponent(pass)}`;
  const res = await fetch(url, { signal: AbortSignal.timeout(timeout || 12000) });
  if (!res.ok) throw new Error('http_error');
  const info = await res.json();
  if (!info || !info.user_info || String(info.user_info.auth) !== '1') throw new Error('auth_failed');
  return info.user_info;
}

function AuthProvider({ children }) {
  const [session, setSession] = useState(null);
  const [ready, setReady] = useState(false);

  useEffect(() => {
    idbGet('session').then((s) => { if (s) setSession(s); setReady(true); }).catch(() => setReady(true));
  }, []);

  const login = useCallback(async (name, serverRaw, user, pass) => {
    const server = normalizeServer(serverRaw);
    const info = await fetchAccount(server, user, pass, 12000);
    const s = { name: name || 'Minha playlist', server, user, pass, exp: info.exp_date || null };
    await idbSet('session', s);
    setSession(s);
    return s;
  }, []);

  // Edita a playlist atual. Só confere no servidor (e recarrega o catálogo) se o acesso mudou.
  const update = useCallback(async (name, serverRaw, user, pass) => {
    const server = normalizeServer(serverRaw);
    const same = !!session && server === session.server && user === session.user && pass === session.pass;
    let exp = session ? session.exp : null;
    if (!same) exp = (await fetchAccount(server, user, pass, 12000)).exp_date || null;
    const s = { name: (name || '').trim() || 'Minha playlist', server, user, pass, exp };
    await idbSet('session', s);
    setSession(s);
    return { changed: !same };
  }, [session]);

  const logout = useCallback(async () => {
    await idbSet('session', null);
    setSession(null);
  }, []);

  return <AuthContext.Provider value={{ session, login, update, logout, ready }}>{children}</AuthContext.Provider>;
}
function useAuth() { return useContext(AuthContext); }

function groupByCat(items) {
  const map = new Map();
  for (const it of items) {
    const k = String(it.category_id);
    let arr = map.get(k);
    if (!arr) { arr = []; map.set(k, arr); }
    arr.push(it);
  }
  return map;
}
function topRated(items, n) {
  const scored = items.map((it) => ({ it, score: parseFloat(it.rating_5based || it.rating || 0) || 0 }));
  const hasRatings = scored.some((s) => s.score > 0);
  scored.sort(hasRatings
    ? (a, b) => b.score - a.score || Number(b.it.added || 0) - Number(a.it.added || 0)
    : (a, b) => Number(b.it.added || 0) - Number(a.it.added || 0));
  return scored.slice(0, n).map((s) => s.it);
}
function newest(items, n) {
  return [...items].sort((a, b) => Number(b.added || b.last_modified || 0) - Number(a.added || a.last_modified || 0)).slice(0, n);
}

function useXtream(session) {
  const [state, setState] = useState({ loading: false, error: null, data: null, done: 0 });
  const [nonce, setNonce] = useState(0);

  useEffect(() => {
    if (!session) return;
    let cancelled = false;
    setState({ loading: true, error: null, data: null, done: 0 });

    async function api(action) {
      const url = `${session.server}/player_api.php?username=${encodeURIComponent(session.user)}&password=${encodeURIComponent(session.pass)}&action=${action}`;
      try {
        const res = await fetch(url, { signal: AbortSignal.timeout(30000) });
        if (!res.ok) throw new Error('http_error');
        const json = await res.json();
        return Array.isArray(json) ? json : [];
      } catch (e) {
        return null;
      } finally {
        if (!cancelled) setState((s) => ({ ...s, done: s.done + 1 }));
      }
    }

    (async () => {
      const [movieCats, movies, seriesCats, series, liveCats, live] = await Promise.all([
        api('get_vod_categories'), api('get_vod_streams'),
        api('get_series_categories'), api('get_series'),
        api('get_live_categories'), api('get_live_streams'),
      ]);
      if (cancelled) return;
      if (movies === null && series === null && live === null) {
        setState({ loading: false, error: 'O servidor não respondeu. Confira sua conexão e tente de novo.', data: null, done: 6 });
        return;
      }
      const withLc = (arr) => (arr || []).map((it) => ({ ...it, name_lc: (it.name || it.title || '').toLowerCase() }));
      const mAll = withLc(movies), sAll = withLc(series), l = withLc(live);
      const mg = groupTitles(mAll), sg = groupTitles(sAll);
      const m = mg.reps, s = sg.reps;
      setState({
        loading: false, error: null, done: 6,
        data: {
          movieCats: movieCats || [], movies: m, movieAll: mAll, movieByCat: groupByCatUniq(mAll, mg.repOf), movieTop: topRated(m, 10), movieNew: newest(m, 40),
          seriesCats: seriesCats || [], series: s, seriesAll: sAll, seriesByCat: groupByCatUniq(sAll, sg.repOf), seriesTop: topRated(s, 10), seriesNew: newest(s, 40),
          liveCats: liveCats || [], live: l, liveByCat: groupByCat(l),
        },
      });
    })();

    return () => { cancelled = true; };
  }, [session && session.server, session && session.user, session && session.pass, nonce]);

  const fetchSeriesInfo = useCallback(async (seriesId) => {
    const url = `${session.server}/player_api.php?username=${encodeURIComponent(session.user)}&password=${encodeURIComponent(session.pass)}&action=get_series_info&series_id=${encodeURIComponent(String(seriesId))}`;
    const res = await fetch(url, { signal: AbortSignal.timeout(15000) });
    return res.json();
  }, [session]);

  const fetchMovieInfo = useCallback(async (vodId) => {
    const url = `${session.server}/player_api.php?username=${encodeURIComponent(session.user)}&password=${encodeURIComponent(session.pass)}&action=get_vod_info&vod_id=${encodeURIComponent(String(vodId))}`;
    const res = await fetch(url, { signal: AbortSignal.timeout(15000) });
    return res.json();
  }, [session]);

  const reload = useCallback(() => setNonce((n) => n + 1), []);

  return { ...state, fetchSeriesInfo, fetchMovieInfo, reload };
}

/* ============================== Progresso ==============================
   Cada item assistido vira uma entrada { key, type, id, time, duration, watched, playedAt, ... }.
   - playedAt só muda quando o vídeo realmente toca; é ele que ordena o "Continuar assistindo".
   - Toda gravação é um merge sobre a entrada atual (nunca sobre uma cópia antiga em memória).
   - O "próximo episódio" é calculado na leitura, a partir do último episódio tocado. */
function migrateProgress(raw) {
  const out = {};
  for (const [k, p] of Object.entries(raw || {})) {
    if (!p || typeof p !== 'object') continue;
    const n = { ...p, key: p.key || k };
    if (n.ready) { n.time = 0; n.duration = 0; delete n.ready; }
    if (n.watched == null) n.watched = n.duration > 1 && n.time >= n.duration * 0.95;
    if (n.playedAt == null) n.playedAt = (n.watched && n.duration === 1) ? 0 : (n.updatedAt || 0);
    if (n.episodeNum == null && typeof n.extraTitle === 'string') {
      const m = n.extraTitle.match(/(\d+)/);
      if (m) n.episodeNum = Number(m[1]);
    }
    out[n.key] = n;
  }
  return out;
}

function buildContinue(map) {
  const out = [];
  const lastBySeries = new Map();
  for (const p of Object.values(map)) {
    if (!p.playedAt) continue;
    if (p.type === 'movie') {
      if (!p.watched) out.push({ kind: 'resume', p, at: p.playedAt });
    } else if (p.type === 'episode' && p.seriesId != null) {
      const sid = String(p.seriesId);
      const cur = lastBySeries.get(sid);
      if (!cur || p.playedAt > cur.playedAt) lastBySeries.set(sid, p);
    }
  }
  for (const p of lastBySeries.values()) {
    if (!p.watched) { out.push({ kind: 'resume', p, at: p.playedAt }); continue; }
    if (!p.nextEp) continue; // terminou o último episódio conhecido
    const nk = `episode-${p.nextEp.id}`;
    const np = map[nk];
    const started = np && !np.watched && np.duration > 0;
    out.push({
      kind: 'next', at: p.playedAt,
      p: {
        key: nk, type: 'episode', id: p.nextEp.id, seriesId: p.seriesId, title: p.title, poster: p.poster,
        season: p.nextEp.season, episodeNum: p.nextEp.episode_num, epTitle: p.nextEp.title,
        ext: p.nextEp.container_extension || 'mp4',
        time: started ? np.time : 0, duration: started ? np.duration : 0, watched: false,
        nextEp: np ? np.nextEp : undefined,
      },
    });
  }
  return out.sort((a, b) => b.at - a.at);
}

function useProgress() {
  const [map, setMap] = useState({});
  const mapRef = useRef({});

  const commit = useCallback((next) => {
    mapRef.current = next;
    setMap(next);
    idbSet('progress', next).catch(() => {});
  }, []);

  useEffect(() => {
    idbGet('progress').then((m) => {
      const merged = { ...migrateProgress(m), ...mapRef.current };
      mapRef.current = merged;
      setMap(merged);
    }).catch(() => {});
  }, []);

  const save = useCallback((key, patch) => {
    const prev = mapRef.current;
    commit({ ...prev, [key]: { ...(prev[key] || {}), ...patch, key } });
  }, [commit]);

  const remove = useCallback((key) => {
    const next = { ...mapRef.current };
    delete next[key];
    commit(next);
  }, [commit]);

  // Tira uma série do "Continuar assistindo" sem apagar o que já foi marcado como assistido.
  const dismissSeries = useCallback((seriesId) => {
    const next = {};
    for (const [k, p] of Object.entries(mapRef.current)) {
      next[k] = (p.type === 'episode' && String(p.seriesId) === String(seriesId)) ? { ...p, playedAt: 0 } : p;
    }
    commit(next);
  }, [commit]);

  const get = useCallback((key) => mapRef.current[key], []);
  const continueList = useMemo(() => buildContinue(map), [map]);

  return { map, get, save, remove, dismissSeries, continueList };
}

function useFavorites() {
  const [map, setMap] = useState({});
  useEffect(() => { idbGet('favorites').then((m) => setMap(m || {})).catch(() => {}); }, []);
  const isFavorite = useCallback((type, id) => !!map[`${type}-${id}`], [map]);
  const toggle = useCallback((entry) => {

      idbSet('favorites', next);
      return next;
    });
  }, []);
  const list = useMemo(() => Object.values(map).sort((a, b) => b.addedAt - a.addedAt), [map]);
  return { list, isFavorite, toggle };
}

function useSearchHistory() {

function Wordmark({ height = 22 }) {

function Sentinel({ onVisible }) {
  const ref = useRef(null);
  const cb = useRef(onVisible);
  cb.current = onVisible;
  useEffect(() => {
    const el = ref.current;
    if (!el || !('IntersectionObserver' in window)) { cb.current(); return; }
    const io = new IntersectionObserver((entries) => { if (entries.some((e) => e.isIntersecting)) cb.current(); }, { rootMargin: '600px' });
    io.observe(el);
    return () => io.disconnect();
  }, []);
  return <div ref={ref} style={{ height: 1 }} />;
}

function Hero({ items, onPlay, onOpen }) {
  const [i, setI] = useState(0);
  const [dir, setDir] = useState('');
  const [tick, setTick] = useState(0); // reinicia o tempo do giro automático a cada troca manual
  const touch = useRef(null);
  const count = items.length;
  useEffect(() => {
    if (count < 2) return;
    const t = setInterval(() => { if (!document.hidden) { setDir(''); setI((n) => (n + 1) % count); } }, 8000);
    return () => clearInterval(t);
  }, [count, tick]);
  const go = (n, d) => { if (count < 2) return; setDir(d); setI(((n % count) + count) % count); setTick((t) => t + 1); };
  const onTouchStart = (e) => { const t = e.touches[0]; touch.current = { x: t.clientX, y: t.clientY }; };
  const onTouchEnd = (e) => {
    const s = touch.current; touch.current = null;
    if (!s) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - s.x, dy = t.clientY - s.y;
    if (Math.abs(dx) < 42 || Math.abs(dx) < Math.abs(dy) * 1.4) return;
    if (dx < 0) go(i + 1, 'next'); else go(i - 1, 'prev');
  };
  if (!count) return <div style={{ height: 'calc(var(--sat) + var(--hh) + 8px)' }} />;
  const cur = items[i % count];
  const it = cur.item;
  const rating = ratingOf(it);
  return (
    <section className="hero" onTouchStart={onTouchStart} onTouchEnd={onTouchEnd} onTouchCancel={() => { touch.current = null; }}>
      {items.map((h, n) => (
        <div key={h.kind + (h.item.stream_id || h.item.series_id)} className={'hero__bg' + (n === i ? ' is-on' : '')}
          style={{ backgroundImage: `url("${h.item.stream_icon || h.item.cover || ''}")` }} />
      ))}
      <div className="hero__shade" />
      {count > 1 && <button className="iconbtn iconbtn--glass hero__arrow hero__arrow--l" onClick={() => go(i - 1, 'prev')} aria-label="Destaque anterior"><i className="ri-arrow-left-s-line" /></button>}
      {count > 1 && <button className="iconbtn iconbtn--glass hero__arrow hero__arrow--r" onClick={() => go(i + 1, 'next')} aria-label="Próximo destaque"><i className="ri-arrow-right-s-line" /></button>}
      <div className={'hero__in' + (dir ? ' hero__in--' + dir : '')} key={i}>
        <button className="hero__poster" onClick={() => onOpen(it, cur.kind)} aria-label={`Abrir ${it.name}`}>
          <div className="ph"><i className="ri-film-line" /></div>
          <Art src={it.stream_icon || it.cover} />
        </button>
        <div className="hero__txt">
          <h1 className="hero__title clamp-3">{it.name}</h1>
          <div className="hero__meta">
            <span className="pill pill--grad">{cur.kind === 'movie' ? 'Filme' : 'Série'}</span>
            {rating && <span className="pill pill--star"><i className="ri-star-fill" />{rating}</span>}
            <span>{cur.label || 'Novo na sua playlist'}</span>
          </div>
          <div className="hero__actions">
            {cur.kind === 'movie'
              ? <button className="btn btn--primary" onClick={() => onPlay(it)}><i className="ri-play-fill" />Assistir</button>
              : <button className="btn btn--primary" onClick={() => onOpen(it, 'series')}><i className="ri-play-list-2-fill" />Ver episódios</button>}
            {cur.kind === 'movie' && <button className="btn btn--ghost" onClick={() => onOpen(it, 'movie')}><i className="ri-information-line" />Detalhes</button>}
          </div>
          {count > 1 && (
            <div className="hero__dots">
              {items.map((_, n) => <button key={n} className={n === i ? 'is-on' : ''} onClick={() => go(n, n < i ? 'prev' : 'next')} aria-label={`Destaque ${n + 1}`} />)}
            </div>
          )}
        </div>
      </div>
    </section>
  );
}

/* ============================== Navegar por categoria ============================== */
const GRID_PAGE = 60;
const ROWS_PAGE = 6;

function Browse({ title, kind, items, cats, byCat, selected, onSelect, onOpen }) {
  const [rows, setRows] = useState(ROWS_PAGE);
  const [shown, setShown] = useState(GRID_PAGE);
  useEffect(() => { setShown(GRID_PAGE); window.scrollTo(0, 0); }, [selected]);

  const usable = useMemo(() => cats.filter((c) => (byCat.get(String(c.category_id)) || []).length > 0), [cats, byCat]);
  const list = selected != null ? (byCat.get(String(selected)) || []) : null;
  // Na visão "Tudo", um título que já saiu numa fileira não volta na fileira de outra categoria.
  const rowItems = useMemo(() => {
    const used = new Set(), out = [];
    for (const c of usable.slice(0, rows)) {
      const picked = [];
      for (const it of byCat.get(String(c.category_id)) || []) {
        if (picked.length >= 18) break;
        const k = it._k || it;
        if (used.has(k)) continue;
        used.add(k); picked.push(it);
      }
      if (picked.length > 0) out.push({ c, picked });
    }
    return out;
  }, [usable, rows, byCat]);

  if (items.length === 0) {
    return (
      <div className="page">
        <h1 className="page__title">{title}</h1>
        <div className="empty">
          <div className="empty__ico"><i className="ri-moon-clear-line" /></div>
          <h3>Nada por aqui</h3>
          <p>Sua playlist não trouxe itens nesta seção.</p>
        </div>
      </div>
    );
  }

  return (
    <div className="page">
      <h1 className="page__title">{title}</h1>
      <div className="chips noscroll">
        <button className={'chip' + (selected == null ? ' is-on' : '')} onClick={() => onSelect(null)}>Tudo</button>
        {usable.map((c) => (
          <button key={c.category_id} className={'chip' + (String(selected) === String(c.category_id) ? ' is-on' : '')} onClick={() => onSelect(c.category_id)}>
            {c.category_name}
          </button>
        ))}
      </div>

      {list ? (
        <>
          <div className="grid">
            {list.slice(0, shown).map((it) => <Poster key={it.stream_id || it.series_id} item={it} kind={kind} grid onClick={() => onOpen(it, kind)} />)}
          </div>
          {shown < list.length && <Sentinel key={shown} onVisible={() => setShown((n) => n + GRID_PAGE)} />}
        </>
      ) : (
        <>
          {rowItems.map(({ c, picked }) => (
            <Row key={c.category_id} title={c.category_name} onMore={() => onSelect(c.category_id)}>
              {picked.map((it) => <Poster key={it.stream_id || it.series_id} item={it} kind={kind} onClick={() => onOpen(it, kind)} />)}
            </Row>
          ))}
          {rows < usable.length && <Sentinel key={rows} onVisible={() => setRows((n) => n + ROWS_PAGE)} />}
          {usable.length === 0 && (
            <div className="grid">
              {items.slice(0, shown).map((it) => <Poster key={it.stream_id || it.series_id} item={it} kind={kind} grid onClick={() => onOpen(it, kind)} />)}
            </div>
          )}
        </>
      )}
    </div>
  );
}
